# Börsen-Cockpit – Daten für Wirtschaftskalender und Konjunktur-Chart
# Holt einmal pro Stunde den Wirtschaftskalender (Forex Factory) und alle drei Stunden die Konjunkturreihen
# der US-Notenbank St. Louis (FRED) und legt sie im Zweig „daten“ dieses Repositorys ab. Die App liest sie von dort.
# Einrichten: Diese Datei als .github/workflows/cockpit-daten.yml ins Repository legen. Sonst ist nichts zu tun.
name: Cockpit-Daten
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cockpit-daten
  cancel-in-progress: true
jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kalender und Konjunkturreihen holen
        run: |
          mkdir -p out
          node - <<'JS'
          const fs = require('fs');
          const REPO = process.env.GITHUB_REPOSITORY;
          const NOW = Date.now();
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36';
          const FRED = ['CPIAUCSL', 'CPILFESL', 'T10YIE', 'FEDFUNDS', 'UNRATE', 'PAYEMS', 'ICSA', 'DGS10', 'DGS2', 'T10Y2Y',
            'M2SL', 'WALCL', 'BAMLH0A0HYM2', 'ECBDFR', 'DTWEXBGS', 'VIXCLS'];
          const wait = (ms) => new Promise((r) => setTimeout(r, ms));
          async function get(url, tries = 3) {
            let last = null;
            for (let i = 0; i < tries; i++) {
              try {
                const r = await fetch(url, { headers: { 'User-Agent': UA, 'Accept': 'text/csv,application/json,*/*' }, signal: AbortSignal.timeout(30000) });
                if (r.ok) return await r.text();
                last = new Error('HTTP ' + r.status);
              } catch (e) { last = e; }
              if (i < tries - 1) await wait(3000 * (i + 1));
            }
            throw last;
          }
          async function previous(name) {
            try { return JSON.parse(await get('https://raw.githubusercontent.com/' + REPO + '/daten/' + name + '.json?v=' + NOW, 1)); } catch (e) { return null; }
          }
          function csv(text) {
            const out = [];
            for (const line of text.split(/\r?\n/).slice(1)) {
              const [d, v] = line.split(',');
              const x = parseFloat(v);
              if (/^\d{4}-\d{2}-\d{2}$/.test(d) && Number.isFinite(x)) out.push([d, x]);
            }
            return out;
          }
          // Tageswerte älter als drei Jahre: nur der letzte Wert jeder Woche (hält die Datei klein)
          function thin(rows) {
            const cut = new Date(NOW - 3 * 365.25 * 864e5).toISOString().slice(0, 10);
            const out = [];
            let week = null;
            for (const r of rows) {
              if (r[0] >= cut) { out.push(r); continue; }
              const w = Math.floor((Date.parse(r[0] + 'T12:00:00Z') / 864e5 + 3) / 7);
              if (w === week) out[out.length - 1] = r; else { out.push(r); week = w; }
            }
            return out;
          }
          (async () => {
            const stand = { t: NOW, ff: '', fred: {} };
            const kal = { v: 1, t: NOW, src: 'Forex Factory', ff: [] };
            try {
              const list = JSON.parse(await get('https://nfs.faireconomy.media/ff_calendar_thisweek.json'));
              if (!Array.isArray(list) || !list.length) throw new Error('leer');
              kal.ff = list.map((x) => ({ title: x.title, country: x.country, date: x.date, impact: x.impact, forecast: x.forecast, previous: x.previous }));
              stand.ff = 'ok · ' + list.length + ' Termine';
            } catch (e) {
              const old = await previous('kalender');
              if (old && Array.isArray(old.ff)) { kal.ff = old.ff; kal.t = old.t; }
              stand.ff = 'Fehler: ' + e.message;
            }
            const old = await previous('makro');
            const keep = old && old.fred && NOW - old.t < 3 * 3600e3 - 10 * 60e3 && FRED.every((id) => Array.isArray(old.fred[id]) && old.fred[id].length > 2);
            const makro = { v: 1, t: 0, src: 'FRED', fred: {}, at: {} };
            const from = new Date(NOW - 11 * 365.25 * 864e5).toISOString().slice(0, 10);
            for (const id of FRED) {
              if (keep) { makro.fred[id] = old.fred[id]; makro.at[id] = (old.at && old.at[id]) || old.t; stand.fred[id] = 'unverändert'; continue; }
              try {
                const rows = csv(await get('https://fred.stlouisfed.org/graph/fredgraph.csv?id=' + id + '&cosd=' + from));
                if (rows.length < 3) throw new Error('zu wenige Werte');
                makro.fred[id] = thin(rows);
                makro.at[id] = NOW;
                stand.fred[id] = 'ok · ' + rows.length;
              } catch (e) {
                if (old && old.fred && old.fred[id]) { makro.fred[id] = old.fred[id]; makro.at[id] = (old.at && old.at[id]) || old.t; }
                stand.fred[id] = 'Fehler: ' + e.message;
              }
              await wait(500);
            }
            makro.t = Math.max(0, ...Object.values(makro.at));
            fs.writeFileSync('out/kalender.json', JSON.stringify(kal));
            if (makro.t > 0) fs.writeFileSync('out/makro.json', JSON.stringify(makro));
            fs.writeFileSync('out/stand.json', JSON.stringify(stand, null, 1));
            fs.writeFileSync('out/README.md', '# Daten fürs Börsen-Cockpit\n\nWird stündlich von der GitHub-Action „Cockpit-Daten“ erzeugt. Bitte nicht von Hand ändern.\n');
            console.log(JSON.stringify(stand, null, 1));
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
      - name: Im Zweig „daten“ ablegen
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b daten
          git config user.name 'Cockpit-Daten'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Daten $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:daten
