  --text:#101828; --muted:#566178; --dim:#8791a4;
  --accent:#a25f00; --accent-soft:rgba(242,179,61,.24);
  --up:#0a8a5f; --up-soft:rgba(10,138,95,.12); --down:#cf2f3c; --down-soft:rgba(207,47,60,.10);
  --info:#1b68cc; --warn:#b9530b;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html:has(#sheet:not([hidden])),html:has(#full:not([hidden])){overflow:hidden}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--f-body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-wrap:break-word}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;z-index:99;background:var(--btn);color:var(--on-btn);padding:10px 14px;border-radius:0 0 10px 0}
.skip:focus{left:0}
.is-up{color:var(--up)} .is-down{color:var(--down)} .is-flat{color:var(--muted)}
.ic{display:block;flex:none}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:30;padding-top:var(--sat);background:var(--bg);border-bottom:1px solid var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .top{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
}
:root[data-theme="light"] .top::before{content:'';position:absolute;left:0;right:0;top:0;height:var(--sat);background:#0c111c}
.top-in{height:var(--top-h);display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;max-width:760px;margin:0 auto}
.top-lead{display:flex;margin-left:-10px}
.top-lead:empty{display:none}
.top-title{flex:1;min-width:0;font:700 26px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acts{display:flex;align-items:center;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 11.5px/1 var(--f-body);white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.is-open{color:var(--up)} .pill.is-open::before{background:var(--up)}
.pill.is-pre,.pill.is-post{color:var(--accent)} .pill.is-pre::before,.pill.is-post::before{background:var(--accent)}

/* ---------- Ansicht und Reiter ---------- */
.view{max-width:760px;margin:0 auto;padding:14px 16px calc(var(--tab-h) + var(--sab) + 28px);display:flex;flex-direction:column;gap:14px;outline:none}
.stack{display:flex;flex-direction:column;gap:14px}
.stack:empty{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:var(--sab);background:var(--surface);border-top:1px solid var(--line)}
.tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:760px;margin:0 auto}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);text-decoration:none;font:600 10.5px/1 var(--f-body)}
.tab .ic{width:24px;height:24px}
.tab.is-on{color:var(--accent)}
.tab{position:relative}
.tab-dot{position:absolute;top:9px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--down);box-shadow:0 0 0 2px var(--surface)}
.seg-nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg-link{height:36px;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 14px/1 var(--f-body);text-decoration:none;white-space:nowrap}
.seg-link.is-on{background:var(--surface-2);color:var(--text)}
.seg-nav.is-sticky{position:sticky;top:calc(var(--sat) + var(--top-h) + 6px);z-index:25;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.seg-n{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--down);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}

/* ---------- Karten ---------- */
.panel,.dayline,.setup,.hero,.depot,.pos,.menu,.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel{overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 8px 16px;min-height:48px}
.panel-head h2,.group-title,.movers h2,.setup h2,.sub{font:700 16px/1.15 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel-controls{display:grid;gap:8px;padding:0 16px 12px}
.panel-controls > *,.filters > *,.stack-s > *{min-width:0}
.panel-body{padding:0 16px 16px}
.panel-body.is-flush{padding:0}
.panel-body.is-list{padding:0 16px}
.panel-src{padding:10px 16px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.4}
.panel-src a{color:var(--muted)}
.pad{padding:0 16px 12px;display:grid;gap:6px}
.group-title{margin:6px 2px -4px}
/* Einklappbare Karte */
.dpanel > summary{cursor:pointer;list-style:none;padding:12px 16px;min-height:50px;justify-content:flex-start;gap:10px}
.dpanel > summary::-webkit-details-marker{display:none}
.dpanel > summary h2{flex:none}
.dpanel > summary::after{content:'';flex:none;width:8px;height:8px;margin:-4px 2px 0 0;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .15s}
.dpanel[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
.dpanel-hint{flex:1;min-width:0;color:var(--dim);font-size:12.5px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpanel > summary h2:only-child{flex:1}
.panel-body > .fold{margin-top:12px}
.panel-body > .fold > summary{padding:13px 0;color:var(--muted);font-size:14px}
.lead{color:var(--muted);font-size:14px}
.about{color:var(--dim);font-size:12px;text-align:center;padding:6px 16px}

/* ---------- Knöpfe, Chips, Felder ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.55}
.btn-quiet{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--down);color:#fff}
.btn-quiet.is-danger{color:var(--down)}
.btn-small{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn-wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row.is-end{justify-content:flex-end}
.btn-row.is-center{justify-content:center}
.btn-col{display:grid;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:12px;background:none;color:var(--text)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn .ic{width:22px;height:22px}
.icon-btn.is-danger{color:var(--down)}
.icon-btn.is-on{color:var(--accent)} .icon-btn.is-on .ic{fill:var(--accent)}
.text-btn{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;padding:10px 8px}
.text-link{font-weight:600;font-size:14px;text-decoration:none}
a.text-btn{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.is-scroll{flex-wrap:nowrap;margin:0 -16px;padding:0 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.is-scroll::-webkit-scrollbar{display:none}
.chips.is-scroll .chip{flex:none}
.chips-row{display:flex;flex-wrap:wrap;gap:8px 16px}
.chip-n{margin-left:6px;color:var(--dim);font-size:11.5px}
.chip.is-on .chip-n{color:inherit;opacity:.75}
.chip-add{gap:4px;border-style:dashed}
.chip-add .ic{width:15px;height:15px}
.stack-s{display:grid;gap:8px}
.stack-s:empty{display:none}
.file-btn{position:relative;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:600 13px/1 var(--f-body);text-decoration:none;white-space:nowrap}
.chip.is-on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.filters{display:grid;gap:10px}
.input{width:100%;min-height:46px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-size:16px;-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--dim)}
.input:focus{outline:none;border-color:var(--accent)}
.textarea{min-height:104px;padding:11px 13px;line-height:1.4;resize:vertical;display:block}
.textarea.is-tall{min-height:260px;font-size:13px}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field-label{font-size:13px;font-weight:600;color:var(--muted)}
.field-help{font-size:12px;color:var(--dim);line-height:1.4}
.field-help a{color:var(--muted)}
.field-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.form-err{color:var(--down);font-size:13.5px;font-weight:600}
.form-note{font-size:13.5px;color:var(--muted)}
.form-note.is-ok{color:var(--up)} .form-note.is-warn{color:var(--warn)}
.panel-body > .field-label{margin:12px 0 8px}
.panel-body > .field-label:first-child{margin-top:0}
.panel-body > .form{margin-top:14px}
.panel-body > .form:first-child{margin-top:0}
.panel-body > .btn-row{margin-top:12px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;min-height:50px}
.switch-text{display:grid;gap:1px;min-width:0}
.switch-t{font-weight:600}
.switch-d{font-size:12.5px;color:var(--muted)}
.switch{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:50px;height:30px;margin:0;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);cursor:pointer;transition:background .15s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.switch:checked{background:var(--up);border-color:transparent}
.switch:checked::after{transform:translateX(20px)}
.feed-row{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.feed-row:first-child{border-top:0}
.feed-row .switch-row{flex:1;min-width:0}

/* ---------- Hinweise, leer, lädt ---------- */
.notice{padding:11px 13px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13.5px}
.notice.is-warn{color:var(--warn)}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:8px;justify-items:center}
.empty-title{color:var(--text);font-weight:700;font-size:15.5px}
.loading{padding:22px 0;color:var(--dim);font-size:13.5px;text-align:center}
.list-status{color:var(--dim);font-size:12px;min-height:17px;padding:0 2px}
.list-status.is-warn{color:var(--warn)}
.list-status:empty{display:none}
.more-row{padding:12px 0 2px}
.fresh{position:sticky;top:calc(var(--sat) + var(--top-h) + 8px);z-index:20;align-self:center;border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:13.5px;padding:9px 16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* ---------- TradingView ---------- */
.tv-host{position:relative;width:100%;min-height:46px;background:var(--surface)}
.tv-host .tradingview-widget-container,.tv-host .tradingview-widget-container__widget{width:100%;height:100%}
.tv-host iframe{display:block;width:100%!important;border:0}
.tv-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;pointer-events:none}
.tv-fail{padding:18px 16px;display:grid;gap:10px;justify-items:start;color:var(--muted);font-size:13.5px}
.tv-info{min-height:150px;margin:0 -16px;width:auto}
.tape{margin:0 -16px;border-block:1px solid var(--line);background:var(--surface)}
.tv-tape{min-height:46px}

/* ---------- Handelstag ---------- */
.dayline{padding:14px 16px 12px}
.dayline-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.dayline-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dayline.is-open .dayline-dot{background:var(--up);box-shadow:0 0 0 4px var(--up-soft)}
.dayline.is-pre .dayline-dot,.dayline.is-post .dayline-dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.dayline-sub{margin-top:2px;color:var(--muted);font-size:13px}
.dayline-bar{position:relative;display:flex;height:8px;margin-top:16px;border-radius:4px;background:var(--surface-2)}
.seg{height:100%}
.seg-pre{background:var(--accent-soft);border-radius:4px 0 0 4px}
.seg-open{background:var(--up);opacity:.8}
.seg-post{background:var(--accent-soft);border-radius:0 4px 4px 0}
.dayline-now{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--surface)}
.dayline-scale{position:relative;height:16px;margin-top:7px;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.dayline-scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.dayline-scale span:first-child,.dayline-scale span.is-end{transform:none}
.dayline-note{margin-top:8px;color:var(--muted);font-size:12px}

/* ---------- Einrichtung ---------- */
.setup{padding:14px 16px;border-color:var(--accent-soft);display:grid;gap:12px}
.setup h2{color:var(--accent)}
.setup ol{display:grid;gap:14px;counter-reset:step}
.setup li{position:relative;padding-left:34px;display:grid;gap:4px;counter-increment:step}
.setup li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-body);text-align:center}
.setup-t{font-weight:700}
.setup-d{color:var(--muted);font-size:13.5px}
.setup .btn-row{margin-top:6px}

/* ---------- Verbinden ---------- */
.status{flex:none;display:inline-flex;align-items:center;gap:6px;margin-right:8px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 11.5px/1 var(--f-body);white-space:nowrap}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.status.is-ok{background:var(--up-soft);color:var(--up)}
.status.is-warn{color:var(--warn)}
.conn-text{color:var(--muted);font-size:14px}
.conn-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:13px}
.conn .form-note{margin-top:12px}
.steps{display:grid;gap:18px;margin-top:14px;counter-reset:step}
.steps li{position:relative;display:grid;gap:8px;padding-left:34px;counter-increment:step}
.steps li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-body);text-align:center}

/* ---------- Depot ---------- */
.depot{padding:16px;background:linear-gradient(165deg,var(--surface-2),var(--surface) 62%)}
.depot-label{display:flex;align-items:center;gap:10px;font:700 16px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--up);font:600 11.5px/1 var(--f-body);letter-spacing:0;text-transform:none}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 1.8s ease-in-out infinite}
.depot-total{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-variant-numeric:tabular-nums}
.depot-num{font:700 54px/.92 var(--f-display);letter-spacing:.01em}
.depot-cur{font:700 24px/1 var(--f-display);color:var(--muted)}
.depot-day{margin-top:8px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.depot-day-l{color:var(--muted);font-weight:400;font-size:13px}
.depot .stats{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.depot-lead{margin:10px 0 14px;color:var(--muted)}
.depot-note{margin-top:10px;color:var(--dim);font-size:12px}
.depot-note a{color:var(--muted)}
.alloc{display:flex;gap:2px;height:8px;margin-top:14px;border-radius:4px;overflow:hidden}
.alloc span{height:100%;min-width:3px}
.alloc-stock{background:var(--info)} .alloc-warrant{background:var(--accent)} .alloc-crypto{background:#b993ff} .alloc-cash{background:#5fcfbd}
:root[data-theme="light"] .alloc-crypto{background:#7b55d6}
:root[data-theme="light"] .alloc-cash{background:#168f7c}
/* Abschnitte des Depots */
.sec{display:grid;gap:8px}
.sec-head{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 4px 0;cursor:pointer;list-style:none}
.sec-head::-webkit-details-marker{display:none}
.sec-head::after{content:'';flex:none;width:7px;height:7px;margin:-4px 3px 0 4px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .15s}
.sec[open] > .sec-head::after{transform:rotate(-135deg);margin-top:4px}
.sec-dot{flex:none;width:9px;height:9px;border-radius:50%}
.sec-t{font:700 16px/1.15 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-n{color:var(--dim);font-size:12px;font-weight:600}
.sec-sum{margin-left:auto;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}

/* ---------- Listen: Watchlist und Depot ---------- */
.rows{overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;background:none;color:inherit;text-align:left;text-decoration:none}
.row-main:active{background:var(--surface-2)}
.row-lwrap{min-width:0;display:block}
.row-l{min-width:0;display:grid;gap:2px}
.row-t{font:700 22px/1.05 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-n{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{flex:none;display:grid;justify-items:end;gap:1px;padding:2px 5px;margin-right:-5px;border-radius:8px;text-align:right;font-variant-numeric:tabular-nums}
.row-tools{display:flex;align-items:center;padding-right:6px}
.row.is-edit .row-r{display:none}
.row-empty{padding:0 16px}
.q-price{font-weight:600;font-size:16px;line-height:1.25}
.q-price small{margin-left:3px;color:var(--muted);font-size:11px;font-weight:600}
.q-chg{font-weight:600;font-size:13px;line-height:1.3}
.q-vol{color:var(--muted);font-size:11.5px;line-height:1.3}
.q-vol.is-up{color:var(--up)} .q-vol.is-down{color:var(--down)}
.q-none{color:var(--dim)}
.flash-up{animation:flashUp .9s ease-out}
.flash-down{animation:flashDown .9s ease-out}
.add{display:flex;gap:8px}
.add .input{flex:1;min-width:0}
.suggest{margin-top:-6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.suggest-item{display:flex;align-items:baseline;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.suggest-item:first-child{border-top:0}
.suggest-t{flex:none;min-width:62px;font:700 18px/1 var(--f-display)}
.suggest-n{min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movers h2{margin:0 2px 8px}
.movers-row{display:flex;gap:8px;margin:0 -16px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.movers-row::-webkit-scrollbar{display:none}
.mover{flex:none;min-width:88px;display:grid;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;font-variant-numeric:tabular-nums}
.mover.is-up{background:var(--up-soft);border-color:transparent}
.mover.is-down{background:var(--down-soft);border-color:transparent}
.mover.is-held{box-shadow:inset 0 0 0 1.5px var(--accent)}
.mover-t{font:700 19px/1 var(--f-display);color:var(--text)}
.mover-p{font-weight:600;font-size:13px}

/* ---------- Menüzeilen ---------- */
.menu{overflow:hidden}
.act-row{display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.act-row:first-child{border-top:0}
.act-row:active{background:var(--surface-2)}
button.act-row{width:100%;border:0;border-top:1px solid var(--line);background:none;font:inherit;text-align:left}
.act-row.is-solo{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.act-text{flex:1;min-width:0;display:grid;gap:1px}
.act-t{font-weight:600}
.act-d{color:var(--muted);font-size:12.5px}
.act-row .ic{width:20px;height:20px;color:var(--dim)}
.act-row .act-ic{width:24px;height:24px;color:var(--accent)}
.panel-body.is-flush .act-row:first-child{border-top:1px solid var(--line)}

/* ---------- Einzelwert ---------- */
.hero{padding:16px;display:grid;gap:10px}
.hero-name{color:var(--muted);font-size:13.5px}
.hero-price{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.hero-num{font:700 52px/.92 var(--f-display);letter-spacing:.01em}
.hero-cur{font:700 24px/1 var(--f-display);color:var(--muted)}
.hero-chg{margin-top:7px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.hero-meta{margin-top:4px;color:var(--dim);font-size:12px}
.hero-wait{color:var(--dim);padding:18px 0}
.hero-tags{display:flex;flex-wrap:wrap;gap:6px}
.hero-tags:not(:has(> :not([hidden]))){display:none}
.hero-tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:0;border-radius:10px;background:var(--surface-2);color:var(--muted);font:600 12.5px/1 var(--f-body);text-decoration:none;white-space:nowrap}
.hero-tag .ic{width:16px;height:16px}
.hero-tag.is-soon,.hero-tag.is-pos{color:var(--accent)}
.panel-head.is-tools{padding:10px 8px 10px 16px;gap:4px}
.panel-head.is-tools .chips{flex:1;min-width:0}
.panel-head.is-tools .chips.is-scroll{margin:0 0 0 -16px;padding:0 8px 0 16px}
.panel-controls.is-below{padding:12px 16px}
.panel-body.is-pad{padding:14px 16px}
#sAlert:empty{display:none}
.alert{display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 14px;border:0;border-radius:var(--r);background:var(--down-soft);color:var(--text);font:400 14px/1.35 var(--f-body);text-align:left}
.alert .ic{width:20px;height:20px;margin-top:1px;color:var(--down)}
.alert strong{margin-right:6px;color:var(--down);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.stat{min-width:0}
.stat dt{color:var(--muted);font-size:12px}
.stat dd{margin-top:1px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.sub{margin:18px 0 4px}
.sub.is-first{margin-top:0}
.fact{display:grid;gap:2px}
.fact-k{color:var(--muted);font-size:12px}
.fact-v{font-weight:700;font-size:16px}
.fact-s{color:var(--muted);font-size:13px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:inherit;font-size:14px;text-decoration:none}
.sub + .line,.line:first-child{border-top:0}
.line-l{min-width:0;display:grid;gap:1px}
.line-s{color:var(--muted);font-size:12px}
.line-r{flex:none;text-align:right;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.line-r.is-soon{color:var(--accent)}
.line > .ic{width:18px;height:18px;color:var(--dim)}
.badge{display:inline-block;min-width:44px;margin-right:8px;padding:2px 6px;border-radius:6px;background:var(--surface-2);font-weight:700;font-size:12px;text-align:center}
.badge.is-key{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{padding:6px 8px;color:var(--muted);font-weight:600;font-size:12px;text-align:right;white-space:nowrap}
.tbl td{padding:8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:0;text-align:left}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl td small{display:block;font-size:11.5px;font-weight:600}
.reco{display:grid;gap:7px}
.reco-bar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.reco-buy{background:var(--up)} .reco-hold{background:var(--dim)} .reco-sell{background:var(--down)}
.reco-legend{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.mood{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mood-text{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.mood-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--down)}
.mood-bull{background:var(--up)}
.post{padding:12px 0;border-top:1px solid var(--line)}
.post:first-child,.mood + .post{border-top:0}
.post-head{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}
.post-head .tag{flex:none}
.post-user{min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-at{color:var(--muted);font-weight:600}
.post.is-fresh{animation:flashNew 2.6s ease-out}
.pad-list{padding:0 16px}
.pad-note{padding:12px 0}
.fold.is-rows{border-top:1px solid var(--line)}
.fold.is-rows summary{padding:14px 16px;color:var(--muted);font-size:14px}
.post-main{display:block;margin-top:5px;color:inherit;text-decoration:none}
.post-body{font-size:14.5px;overflow-wrap:anywhere}
.post-foot{margin-top:4px;color:var(--muted);font-size:12px}

/* ---------- Nachrichten ---------- */
.news{padding:13px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news{position:relative}
.news.is-urg1::before,.news.is-urg2::before{content:'';position:absolute;left:-16px;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.news.is-urg2::before{background:var(--down)}
.news-sec{margin:0 -16px;padding:15px 16px 0;font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.news-sec:not(:first-child){margin-top:2px;border-top:1px solid var(--line)}
.news-sec.is-2{color:var(--down)} .news-sec.is-1{color:var(--accent)}
.news-sec + .news{border-top:0}
.urg{flex:none;padding:2px 7px;border-radius:999px;font-weight:700;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase}
.urg-1{background:var(--accent-soft);color:var(--accent)}
.urg-2{background:var(--down);color:#fff}
.brief-row{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.brief-row:first-child{border-top:0;padding-top:2px}
.brief-top{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}
.brief-top .tag,.brief-top .urg{flex:none}
.brief-src{min-width:0;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-top time{flex:none;margin-left:auto;color:var(--dim)}
.brief-title{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-head{display:flex;align-items:center;gap:8px;font-size:12px}
.news-src{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier-p{color:var(--info)} .tier-a{color:var(--text)} .tier-b{color:var(--muted)} .tier-c{color:var(--dim)}
.news-prim{flex:none;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);font-weight:700;font-size:10.5px}
.news-time{flex:none;margin-left:auto;color:var(--dim)}
.news-time.is-fresh{color:var(--accent);font-weight:700}
.news-main{display:grid;gap:4px;margin-top:5px;color:inherit;text-decoration:none}
.news-title{font-weight:600;font-size:15.5px;line-height:1.35}
.news-sum{color:var(--muted);font-size:13px;line-height:1.4}
.news-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.news-more{color:var(--dim);font-size:11.5px}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border:0;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 11.5px/1 var(--f-body)}
.tag-sym{background:var(--accent-soft);color:var(--accent)}
.tag-sym.is-held{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tag-sym > span{margin-left:5px;font-weight:700}
.tag-bull{background:var(--up-soft);color:var(--up)}
.tag-bear{background:var(--down-soft);color:var(--down)}
.tag-new{background:var(--accent-soft);color:var(--accent)}

/* ---------- Rechner ---------- */
.pos{padding:16px;display:grid;gap:12px}
.pos-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pos-head h3{font:700 24px/1.05 var(--f-display);letter-spacing:.02em}
.pos-pl{font-weight:700;font-variant-numeric:tabular-nums}
.pos-sub{margin-top:-8px;color:var(--muted);font-size:13px}

/* ---------- Hilfe ---------- */
.fold{border-top:1px solid var(--line)}
.fold:first-child{border-top:0}
.fold summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;font-weight:700;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.fold[open] summary::after{transform:rotate(-135deg)}
.prose{display:grid;gap:10px;padding-bottom:16px;color:var(--muted);font-size:14.5px;max-width:65ch}
.prose strong{color:var(--text)}
.prose ol,.prose ul{display:grid;gap:6px;padding-left:20px}
.prose ol{list-style:decimal} .prose ul{list-style:disc}

/* ---------- Blatt, Vollbild, Hinweis ---------- */
#sheet{position:fixed;inset:0;z-index:60}
.sheet-back{position:absolute;inset:0;background:rgba(3,6,12,.62)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-width:760px;max-height:92%;margin:0 auto;display:flex;flex-direction:column;padding-bottom:var(--sab);border-radius:20px 20px 0 0;background:var(--surface);box-shadow:0 -12px 44px rgba(0,0,0,.4);animation:sheetUp .22s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 8px 18px}
.sheet-head h2{min-width:0;font:700 24px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.sheet-body{display:grid;gap:14px;padding:4px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-text{color:var(--muted);font-size:14px}
.full{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;padding:var(--sat) 0 var(--sab);background:var(--bg)}
.full-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px}
.full-head h2{font:700 24px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.full-body{position:relative;flex:1;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 14px);z-index:70;transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 17px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.35)}

#toast.is-link{left:16px;right:16px;transform:none;max-width:520px;margin:0 auto;padding:0;border-radius:16px;text-align:left}
#toast.is-link a{display:grid;gap:2px;padding:12px 16px;color:inherit;text-decoration:none}
#toast.is-link strong{font-size:12px;opacity:.72}
#toast.is-link span{font-size:14px;line-height:1.35}
@keyframes flashNew{from{background:var(--accent-soft)}to{background:transparent}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes flashUp{from{background:var(--up-soft)}to{background:transparent}}
@keyframes flashDown{from{background:var(--down-soft)}to{background:transparent}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .view{padding-top:20px}
}

/* ---------- Märkte im eigenen Design ---------- */
.mk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.mk-state{display:flex;align-items:center;gap:9px;min-width:0;color:var(--muted);font-size:13px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.is-open{background:var(--up);box-shadow:0 0 0 4px var(--up-soft)}
.dot.is-pre,.dot.is-post{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mk-block{display:grid;gap:8px}
.mk-h{display:flex;align-items:baseline;gap:8px;margin:0 2px;font:700 16px/1.15 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mk-h small{font:500 12px/1.2 var(--f-body);letter-spacing:0;text-transform:none;color:var(--dim)}
.movers .mk-h{margin:0 2px 8px}
.mk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-tile{position:relative;display:grid;gap:7px;align-content:start;padding:12px 12px 11px 15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums;overflow:hidden}
.mk-tile::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--dim)}
.mk-tile.is-up::before{background:var(--up)} .mk-tile.is-down::before{background:var(--down)}
.mk-tile:active,.mk-sec:active{filter:brightness(1.12)}
.mk-n{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600;font-size:13.5px;line-height:1.2;color:var(--text)}
.mk-p{font:700 30px/1 var(--f-display);letter-spacing:.01em;color:var(--muted)}
.mk-tile.is-up .mk-p{color:var(--up)} .mk-tile.is-down .mk-p{color:var(--down)}
.mk-range{position:relative;height:3px;margin:1px 4px 1px 0;border-radius:2px;background:var(--surface-2);color:var(--muted)}
.mk-tile.is-up .mk-range{color:var(--up)} .mk-tile.is-down .mk-range{color:var(--down)}
.mk-range i{position:absolute;top:-2.5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:currentColor}
.mk-s{color:var(--dim);font-size:11.5px;line-height:1.2}
.mk-heat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mk-sec{display:grid;gap:5px;align-content:center;min-height:60px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums;min-width:0}
.mk-sec.is-up{border-color:transparent;background:color-mix(in srgb,var(--up) calc(var(--a,.2)*100%),var(--surface))}
.mk-sec.is-down{border-color:transparent;background:color-mix(in srgb,var(--down) calc(var(--a,.2)*100%),var(--surface))}
.mk-sn{font-size:12px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-sp{font:700 18px/1 var(--f-display)}
/* Schalter Dollar/Euro, Kennzeichen für Vor- und Nachbörse */
.cur-sw{flex:none;display:inline-grid;grid-auto-flow:column;gap:2px;min-height:40px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cur-sw span{display:grid;place-items:center;min-width:32px;border-radius:9px;color:var(--muted);font:700 17px/1 var(--f-display)}
.cur-sw span.is-on{background:var(--accent-soft);color:var(--accent)}
.q-ses{display:inline-block;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:700 10px/1.2 var(--f-body);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.row-r .q-ses{margin-top:3px}
.hero-x{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.hero-x strong{font-weight:700} .hero-x span[class^="is-"]{font-weight:700} .hero-x time{color:var(--dim);font-size:12px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hero-top .hero-name{min-width:0;padding-top:3px}
.hero-top .cur-sw{min-height:34px;margin:-4px -4px 0 0} .hero-top .cur-sw span{min-width:28px;font-size:15px}
.wl-top{display:flex;align-items:center;gap:8px}
.wl-top .chips.is-scroll{flex:1;min-width:0;margin:0 0 0 -16px;padding:0 6px 0 16px}
.wl-fill{flex:1}
/* Eigene Infos zu einem Wert */
.info{display:flex;align-items:flex-start;gap:4px;padding:11px 0;border-top:1px solid var(--line)}
.info:first-child{border-top:0;padding-top:0} .info:last-child{padding-bottom:2px}
.info-main{flex:1;min-width:0} .info-text{font-size:14.5px;line-height:1.4;white-space:pre-line}
.info-meta{margin-top:5px;color:var(--dim);font-size:12px}
.info .icon-btn{margin:-8px -10px 0 0;color:var(--dim)} .info .icon-btn .ic{width:18px;height:18px}
/* Rückfrage vor dem Übernehmen eines Datenpakets */
.plan{display:grid;gap:14px;margin-bottom:16px}
.plan-g{display:grid;gap:6px}
.plan-g h3{font:700 14px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plan-l{display:grid;gap:5px;font-size:14px}
.plan-l li{display:flex;align-items:baseline;gap:8px;min-width:0}
.plan-l li > span:last-child{min-width:0}
.plan-k{flex:none;width:76px;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;text-align:center}
.plan-k.is-new{background:var(--up-soft);color:var(--up)} .plan-k.is-chg{background:var(--accent-soft);color:var(--accent)} .plan-k.is-del{background:var(--down-soft);color:var(--down)}
.plan-note{color:var(--muted);font-size:13px}
/* Starke Bewegungen auf der Startseite */
.strong{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.strong:last-child{padding-bottom:2px}
.strong a{display:inline-flex;align-items:baseline;gap:6px;min-height:34px;padding:7px 10px;border-radius:10px;background:var(--surface-2);color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums}
.strong a.is-up{background:var(--up-soft)} .strong a.is-down{background:var(--down-soft)}
.strong a.is-held{box-shadow:inset 0 0 0 1.5px var(--accent)}
.strong b{font:700 16px/1 var(--f-display)} .strong span{font-weight:700;font-size:13px}
.strong a.is-up span{color:var(--up)} .strong a.is-down span{color:var(--down)}
.tag-mk{background:var(--surface-2);color:var(--info)}
.btn .ic{width:18px;height:18px;flex:none}
.plan-note.is-warn{color:var(--warn)}
.mk-rows .row-main{min-height:54px;padding:8px 14px}
.mk-rows .row-t{font:600 15.5px/1.25 var(--f-body);letter-spacing:0}
.mk-rows .q-price{font-size:15.5px}
.strong-l{align-self:center;margin-left:2px;color:var(--dim);font-size:11.5px}
.panel-lead{padding:2px 16px 12px;color:var(--muted);font-size:13.5px;line-height:1.4}
.fold-pad{display:grid;gap:10px;padding:2px 16px 16px}
.js-infos:empty{display:none}

/* ---------- Trends: Gewinner, Verlierer, meistgehandelt ---------- */
.tr-panel .panel-head{align-items:baseline;justify-content:flex-start;gap:10px}
.tr-when{color:var(--dim);font-size:12px}
.tr-list{list-style:none;margin:0;padding:0}
.tr-list li + li .tr-row{border-top:1px solid var(--line)}
.tr-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums}
.tr-row:active{background:var(--surface-2)}
.tr-i{flex:none;width:18px;color:var(--dim);font-size:12px;font-weight:600;text-align:right}
.tr-main{flex:1;min-width:0;display:grid;gap:4px}
.tr-t{display:flex;align-items:center;gap:7px;font:700 19px/1 var(--f-display);letter-spacing:.03em}
.tr-own{flex:none;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--accent)}
.tr-row.is-held .tr-own{background:var(--accent)}
.tr-n{color:var(--muted);font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-r{flex:none;display:grid;justify-items:end;gap:5px}
.tr-p{font-weight:600;font-size:15px;line-height:1.1}
.tr-c{min-width:80px;padding:4px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:13.5px;line-height:1.1;text-align:right}
.tr-c.is-up{background:var(--up-soft);color:var(--up)} .tr-c.is-down{background:var(--down-soft);color:var(--down)}
.tr-x{color:var(--dim);font-size:11px}
/* ---------- Wirtschaftskalender ---------- */
.cal{display:grid;padding:0 0 6px}
.cal-next{display:grid;gap:4px;margin:2px 16px 8px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.cal-next-l{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cal-next strong{font-size:15px;line-height:1.3}
.cal-next span:last-child{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.cal-dh{padding:12px 16px 6px;font:700 14px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal-list{list-style:none;margin:0;padding:0}
.cal-row{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 16px;border-top:1px solid var(--line)}
.cal-time{flex:none;width:44px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cal-time.is-day{font-weight:600;font-size:10.5px;color:var(--dim);line-height:1.2}
.cal-flag{flex:none;font-size:18px;line-height:1}
.cal-main{flex:1;min-width:0;display:grid;gap:3px}
.cal-n{font-size:14.5px;font-weight:600;line-height:1.3}
.cal-v{color:var(--muted);font-size:12.5px;line-height:1.3;font-variant-numeric:tabular-nums}
.cal-imp{flex:none;display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.cal-imp i{width:4px;border-radius:1px;background:var(--surface-2)}
.cal-imp i:nth-child(1){height:6px} .cal-imp i:nth-child(2){height:10px} .cal-imp i:nth-child(3){height:14px}
.cal-imp.is-3 i{background:var(--down)}
.cal-imp.is-2 i:nth-child(-n+2){background:var(--accent)}
.cal-imp.is-1 i:nth-child(1){background:var(--muted)}
.cal-hol{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--info)}
.cal-row.is-imp0 .cal-n{color:var(--info)}
.cal-row.is-past{opacity:.48}
.cal .empty{padding-top:6px}

/* ---------- Eigene Charts ---------- */
.ch-panel .panel-head.is-tools{gap:6px}
.ch-read{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 10px;min-height:26px;padding:0 16px 4px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ch-read strong{color:var(--text);font-size:16px;font-weight:700}
.ch-chg{font-weight:700} .ch-chg.is-up{color:var(--up)} .ch-chg.is-down{color:var(--down)}
.ch-read .ch-x{display:inline-flex;align-items:baseline;gap:6px;padding:2px 8px;border-radius:8px;background:var(--surface-2,rgba(127,127,127,.12))}
.ch-read .ch-x strong{font-size:14px}
.ch-box{position:relative;min-height:200px;padding:0 4px 0 0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ch-wait,.ch-empty{display:grid;place-items:center;min-height:200px;padding:16px;color:var(--muted);font-size:14px;line-height:1.5;text-align:center}
.ch-svg{display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ylab,.ch-xlab{fill:var(--dim);font:500 10.5px var(--f-body);font-variant-numeric:tabular-nums}
.ch-ylab{text-anchor:end} .ch-xlab{text-anchor:middle} .ch-ylab.is-sub{font-size:9.5px}
.ch-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-line.is-up{stroke:var(--up)} .ch-line.is-down{stroke:var(--down)}
.ch-g0.is-up{stop-color:var(--up);stop-opacity:.3} .ch-g0.is-down{stop-color:var(--down);stop-opacity:.3}
.ch-g1{stop-opacity:0} .ch-g1.is-up{stop-color:var(--up)} .ch-g1.is-down{stop-color:var(--down)}
.ch-area{stroke:none}
.ch-last.is-up{fill:var(--up)} .ch-last.is-down{fill:var(--down)}
.ch-base{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.75}
.ch-ext{fill:var(--surface-2);opacity:.6}
.ch-wick{stroke-width:1} .ch-wick.is-up{stroke:var(--up)} .ch-wick.is-down{stroke:var(--down)}
.ch-body.is-up{fill:var(--up)} .ch-body.is-down{fill:var(--down)}
.ch-vol{opacity:.45} .ch-vol.is-up{fill:var(--up)} .ch-vol.is-down{fill:var(--down)}
.ch-ma{fill:none;stroke-width:1.5} .ch-ma1{stroke:#5ea8ff} .ch-ma2{stroke:var(--accent)} .ch-ma3{stroke:#c58cff}
.ch-rsi{fill:none;stroke:#5ea8ff;stroke-width:1.5} .ch-rsi-band{fill:var(--surface-2);opacity:.65}
.ch-cross line{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ch-dot{fill:var(--text);stroke:var(--surface);stroke-width:2}
.chip[data-act="chart-ind"].is-on[data-v="sma20"]{box-shadow:inset 0 -3px 0 #5ea8ff}
.chip[data-act="chart-ind"].is-on[data-v="sma50"]{box-shadow:inset 0 -3px 0 var(--accent)}
.chip[data-act="chart-ind"].is-on[data-v="sma200"]{box-shadow:inset 0 -3px 0 #c58cff}
.chip[data-act="chart-ind"].is-on[data-v="rsi"]{box-shadow:inset 0 -3px 0 #5ea8ff}
.full-body.is-own{overflow:auto;padding:4px 0 16px}
/* ---------- Technik, Kennzahlen, Profil ---------- */
.ta-head{display:grid;gap:6px;margin-bottom:6px;padding:2px 0 14px;border-bottom:1px solid var(--line)}
.ta-l{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ta-head strong{font:700 26px/1 var(--f-display);letter-spacing:.02em}
.ta-head.is-up strong{color:var(--up)} .ta-head.is-down strong{color:var(--down)}
.ta-bar{position:relative;height:6px;margin:6px 7px 2px;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--surface-2) 50%,var(--up))}
.ta-bar i{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px var(--surface)}
.ta-head small{color:var(--dim);font-size:12px}
.ta-list{list-style:none;margin:0;padding:0}
.ta-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.ta-list li:first-child{border-top:0}
.ta-list li span:first-child{color:var(--muted)}
.ta-list li span:last-child{font-weight:600;text-align:right}
.ta-list .is-up,.stats .is-up{color:var(--up)} .ta-list .is-down,.stats .is-down{color:var(--down)}
.ta-h{margin:16px 0 6px;color:var(--muted);font:700 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.ta-h:first-child{margin-top:0}
.ta-perf{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.ta-perf div{display:grid;gap:4px;padding:9px 10px;border-radius:10px;background:var(--surface-2)}
.ta-perf span{color:var(--muted);font-size:11.5px}
.ta-perf strong{font-size:15px;font-variant-numeric:tabular-nums}
.ta-perf .is-up strong{color:var(--up)} .ta-perf .is-down strong{color:var(--down)}
.prof-logo{float:right;width:44px;height:44px;margin:0 0 8px 12px;border-radius:10px;background:#fff;object-fit:contain}
.prof-web{margin-top:10px}
.cal-more{padding:12px 16px 4px;color:var(--muted);font-size:13px}
/* ---------- Karte (Flächen nach Größe, Farbe nach Veränderung) ---------- */
.hm{position:relative;overflow:hidden;border-radius:12px;background:var(--surface)}
.hm-t{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:1px;overflow:hidden;border-radius:5px;
  background:var(--surface-2);color:var(--text);line-height:1.1;text-align:center;text-decoration:none}
.hm-t.is-up{background:color-mix(in srgb,var(--up) calc(var(--a,.3)*100%),var(--surface))}
.hm-t.is-down{background:color-mix(in srgb,var(--down) calc(var(--a,.3)*100%),var(--surface))}
.hm-t b{max-width:94%;overflow:hidden;font-weight:800;font-size:1em;white-space:nowrap;text-overflow:ellipsis}
.hm-t span{font-weight:600;font-size:.78em;font-variant-numeric:tabular-nums}
.hm-t small{font-size:.62em;opacity:.85}
.hm-t.is-s b{font-size:.85em} .hm-t.is-s span{font-size:.72em}
.hm-t.is-xs b,.hm-t.is-xs span{display:none}
.hm-t:active{filter:brightness(1.15)}

/* ---------- Kursalarme ---------- */
.hero-tag.is-on{background:var(--accent-soft);color:var(--accent)}
.al-h{margin:14px 0 6px;color:var(--muted);font:700 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.al-h:first-child{margin-top:0}
.al-list{list-style:none;margin:0 0 6px;padding:0}
.al-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.al-row:first-child{border-top:0}
.al-row > .ic{flex:none;width:20px;height:20px;color:var(--accent)}
.al-row.is-hit > .ic{color:var(--dim)}
.al-main{flex:1;min-width:0;display:grid;gap:2px}
.al-main strong{font-size:16px;font-variant-numeric:tabular-nums}
.al-main small{color:var(--muted);font-size:12.5px}
.al-t{color:var(--text);font-weight:800;text-decoration:none}
.al-row.is-hit strong{color:var(--muted)}
/* ---------- Investment-Regeln ---------- */
.ru-count{color:var(--dim);font-size:12.5px}
.ru-bar{height:6px;margin:2px 0 12px;overflow:hidden;border-radius:3px;background:var(--surface-2)}
.ru-bar i{display:block;height:100%;border-radius:3px;background:var(--up);transition:width .25s}
.ru-list{list-style:none;margin:0;padding:0}
.ru-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ru-row:first-child{border-top:0}
.ru-check{flex:none;display:grid;place-items:center;width:30px;height:30px;margin-top:-3px;border:2px solid var(--line);border-radius:9px;background:none;color:transparent}
.ru-check .ic{width:18px;height:18px}
.ru-row.is-done .ru-check{border-color:var(--up);background:var(--up);color:var(--surface)}
.ru-text{flex:1;min-width:0;font-size:15px;line-height:1.4}
.ru-row.is-done .ru-text{color:var(--muted)}
.ru-tools{flex:none;display:flex;margin:-8px -8px 0 0}
.ru-tools .icon-btn{color:var(--dim)} .ru-tools .icon-btn .ic{width:18px;height:18px}
.ru-ok{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--up);font-weight:700}
.ru-ok .ic{width:20px;height:20px}
.btn-row.is-center{justify-content:center}
/* ---------- Lebensplaner ---------- */
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.pl-f{display:grid;gap:4px;align-content:start}
.pl-f small{color:var(--dim);font-size:11.5px}
.pl-res{display:grid;gap:4px;margin-bottom:8px}
.pl-res span{color:var(--muted);font-size:13px}
.pl-res strong{font:700 34px/1 var(--f-display);letter-spacing:.01em}
.pl-res.is-up strong{color:var(--up)} .pl-res.is-down strong{color:var(--accent)}
.pl-res small{color:var(--muted);font-size:13px}
.pl-svg{display:block;width:100%;height:auto;margin:6px 0 10px}
.pl-area{fill:var(--up);opacity:.14} .pl-line{fill:none;stroke:var(--up);stroke-width:2.2;stroke-linejoin:round}
.pl-target{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4}
.pl-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.pl-lab{fill:var(--dim);font:500 11px var(--f-body)} .pl-lab.is-end,.pl-lab.is-t{text-anchor:end} .pl-lab.is-t{fill:var(--accent)}
.pl-goals{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:12px}
.pl-goal small{color:var(--muted);font-size:12px}
.pl-gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pl-gh strong{flex:1;min-width:0} .pl-gh span{color:var(--muted);font-size:13px}
.pl-gh .icon-btn{margin:-8px -8px -8px 0;color:var(--dim)}
.pl-gform{margin-top:6px}
.pl-svg ~ .plan-note{margin-top:12px}
/* ---------- Quartalszahlen ---------- */
.er-list{display:flex;flex-direction:column}
.er-day{padding:12px 16px 6px;font:700 14px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.er-list > .er-day:first-child{border-top:0}
.er-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:9px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.er-day + .er-row{border-top:0}
.er-row:active{background:var(--surface-2)}
.er-l{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px}
.er-l strong{font:700 20px/1.05 var(--f-display);letter-spacing:.02em}
.er-l small{flex-basis:100%;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er-tag,.er-st{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font:700 10.5px/1 var(--f-body);letter-spacing:.02em;white-space:nowrap}
.er-tag{background:var(--accent-soft);color:var(--accent)} .er-tag.is-w{background:var(--surface-2);color:var(--muted)}
.er-st.is-done{background:var(--up-soft);color:var(--up)} .er-st.is-pr{background:rgba(125,183,255,.15);color:var(--info)}
.er-st.is-due{background:var(--surface-2);color:var(--warn)} .er-st.is-due::before{content:'';width:6px;height:6px;margin-right:5px;border-radius:50%;background:currentColor;animation:er-pulse 1.4s ease-in-out infinite}
@keyframes er-pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.er-st.is-due::before{animation:none}}
.er-r{flex:none;display:grid;justify-items:end;gap:2px;max-width:55%;color:var(--muted);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.er-v{font:700 13.5px/1.2 var(--f-body)} .er-v.is-up{color:var(--up)} .er-v.is-down{color:var(--down)} .er-v.is-flat{color:var(--text)}
.er-sub{margin-bottom:10px;color:var(--muted);font-size:13.5px}
.er-tab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
.er-tab th,.er-tab td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.er-tab th:first-child{padding-left:0;text-align:left;font-weight:600} .er-tab td:last-child{padding-right:0;font-weight:700}
.er-tab thead th{padding-top:0;color:var(--dim);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.er-note{margin-top:10px;color:var(--dim);font-size:12.5px;line-height:1.45}
.er-move{margin-top:12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.er-move strong{font-size:16px}
.er-verdict{display:grid;gap:6px;margin:12px 0;padding:13px 14px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--dim);font-size:14px;line-height:1.45}
.er-verdict strong{font:700 18px/1.15 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.er-verdict.is-up,.er-verdict.is-down,.er-verdict.is-flat{color:var(--text)}
.er-verdict.is-up{border-left-color:var(--up)} .er-verdict.is-up strong{color:var(--up)}
.er-verdict.is-down{border-left-color:var(--down)} .er-verdict.is-down strong{color:var(--down)}
.er-verdict small,.er-ai-text small{color:var(--dim);font-size:11.5px}
.er-pr{margin:10px 0;font-size:14px;line-height:1.45} .er-pr small{color:var(--dim)}
.er-ai{margin:12px 0}
.er-ai:empty{display:none}
.er-ai-text{display:grid;gap:7px;padding:13px 14px;border-radius:12px;background:var(--accent-soft);font-size:14.5px;line-height:1.5}
.er-ai-text strong{color:var(--accent)}
.er-ai .loading{padding:14px 0;text-align:left}
/* ---------- Stimmung: Fear & Greed ---------- */
.fg-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fg-card{display:grid;gap:6px;justify-items:center;padding:12px;border-radius:12px;background:var(--surface-2);text-align:center}
.fg-head{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fg-g{display:block;width:100%;max-width:190px;height:auto}
.fg-g path{fill:none;stroke-width:11;stroke-linecap:butt}
.fg-s1{stroke:#e5484d} .fg-s2{stroke:#f2903d} .fg-s3{stroke:#c9ccd3} .fg-s4{stroke:#7fcf6a} .fg-s5{stroke:#2fb47c}
.fg-n{stroke:var(--text);stroke-width:2.6;stroke-linecap:round} .fg-c{fill:var(--text)}
.fg-score{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600}
.fg-score b{font:700 34px/1 var(--f-display)}
.fg-prev{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;color:var(--dim);font-size:12px}
.fg-prev b{font-weight:700}
.fg-x-fear{color:#e5484d} .fg-fear{color:#f2903d} .fg-neutral{color:var(--muted)} .fg-greed{color:#7fcf6a} .fg-x-greed{color:#2fb47c}
.fg-parts{width:100%;margin-top:4px;text-align:left}
.fg-parts summary{padding:8px 0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.fg-parts ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fg-parts li{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:1.35}
.fg-parts li span{color:var(--muted)} .fg-parts li b{flex:none;font-weight:700}
/* ---------- Nachbörse und Nacht: Prüfung der Token-Märkte ---------- */
.tk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.tk-list:empty{display:none}
.tk-row{display:grid;grid-template-columns:18px auto 1fr;align-items:baseline;gap:4px 8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4}
.tk-row:first-child{border-top:0}
.tk-row .loading{grid-column:1 / -1;padding:6px 0;text-align:left}
.tk-ic{font-weight:700;text-align:center} .tk-row.is-ok .tk-ic{color:var(--up)} .tk-row.is-off .tk-ic{color:var(--down)}
.tk-n{font-weight:600;white-space:nowrap}
.tk-m{min-width:0;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
:root[data-theme="light"] .fg-s3{stroke:#a9afba} :root[data-theme="light"] .fg-n{stroke:var(--text)}
/* ---------- Neue Werkzeuge: Briefing, Lagebild, Szenarien, Hinweise ---------- */
.head-acts{display:flex;align-items:center;gap:2px}
.er-h{margin:16px 0 8px;font:700 14px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.er-scen{margin-bottom:12px}

<script>
/* ===== 00-util.js ===== */
/* Börsen-Cockpit – Hilfsfunktionen (Formatierung, Zeit, Netz, Speicher) */
(function (root) {
  'use strict';
  var BC = root.BC = root.BC || {};
  var U = BC.util = {};

  /* ---------- Text & Sicherheit ---------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  U.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  };

  /* Nur http(s)-Adressen durchlassen – alles andere wird verworfen. */
  U.safeUrl = function (u) {
    var s = String(u == null ? '' : u).trim();
    if (typeof URL === 'function') {
      try {
        var x = new URL(s);
        return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
      } catch (e) { return ''; }
    }
    /* Ohne die URL-Klasse des Browsers (im Widget): nur schlichte http(s)-Adressen durchlassen */
    return /^https?:\/\/[^\s<>"'`\\^{}|]+$/i.test(s) ? s : '';
  };

  var BASIC_ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', ndash: '–', mdash: '—', hellip: '…', rsquo: '’', lsquo: '‘', rdquo: '”', ldquo: '“', euro: '€' };
  U.decodeEntities = function (s) {
    return String(s == null ? '' : s).replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, function (m, e) {
      if (e.charAt(0) === '#') {
        var code = (e.charAt(1) === 'x' || e.charAt(1) === 'X') ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        if (!isFinite(code) || code <= 0 || code > 0x10FFFF) return '';
        try { return String.fromCodePoint(code); } catch (err) { return ''; }
      }
      return Object.prototype.hasOwnProperty.call(BASIC_ENT, e) ? BASIC_ENT[e] : m;
    });
  };

  /* HTML aus Feed-Texten entfernen: Ergebnis ist reiner Text (wird später trotzdem escaped). */
  U.plain = function (s) {
    var t = String(s == null ? '' : s)
      .replace(/<!\[CDATA\[|\]\]>/g, '')
      .replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ')
      .replace(/<[^>]*>/g, ' ');
    t = U.decodeEntities(t);
    return t.replace(/\s+/g, ' ').trim();
  };

  U.truncate = function (s, n) {
    s = String(s || '');
    if (s.length <= n) return s;
    var cut = s.slice(0, n);
    var sp = cut.lastIndexOf(' ');
    if (sp > n * 0.6) cut = cut.slice(0, sp);
    return cut.replace(/[\s,;:.\-–]+$/, '') + '…';
  };

  /* ---------- Zahlen ---------- */
  var NF = {};
  function nf(d) {
    if (!NF[d]) NF[d] = new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
    return NF[d];
  }
  U.ok = function (v) { return typeof v === 'number' && isFinite(v); };
  U.num = function (v, d) { return U.ok(v) ? nf(d == null ? 2 : d).format(v) : '–'; };

  U.priceDigits = function (v) {
    var a = Math.abs(v);
    if (a >= 1) return 2;
    if (a >= 0.01) return 4;
    return 6;
  };
  U.price = function (v) { return U.ok(v) ? nf(U.priceDigits(v)).format(v) : '–'; };

  var MINUS = '−', NBSP = ' ';
  U.signed = function (v, d) {
    if (!U.ok(v)) return '–';
    var s = nf(d == null ? 2 : d).format(Math.abs(v));
    if (v > 0) return '+' + s;
    if (v < 0) return MINUS + s;
    return s;
  };
  U.pct = function (v, d) { return U.ok(v) ? U.signed(v, d == null ? 2 : d) + NBSP + '%' : '–'; };
  U.dir = function (v) { return !U.ok(v) || v === 0 ? 'flat' : (v > 0 ? 'up' : 'down'); };

  /* 48312345 -> "48,3 Mio." */
  U.compact = function (v) {
    if (!U.ok(v)) return '–';
    var a = Math.abs(v);
    if (a >= 1e12) return nf(2).format(v / 1e12) + NBSP + 'Bio.';
    if (a >= 1e9) return nf(2).format(v / 1e9) + NBSP + 'Mrd.';
    if (a >= 1e6) return nf(1).format(v / 1e6) + NBSP + 'Mio.';
    if (a >= 1e4) return nf(0).format(v / 1e3) + NBSP + 'Tsd.';
    return nf(0).format(v);
  };

  /* "12,5" oder "12.5" aus Eingabefeldern lesen */
  U.parseNum = function (s) {
    if (typeof s === 'number') return s;
    s = String(s == null ? '' : s).trim().replace(/\s/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else {
      s = s.replace(',', '.');
    }
    return /^[-+]?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
  };

  U.clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
  U.pad = function (n) { return (n < 10 ? '0' : '') + n; };

  /* ---------- Zeit ---------- */
  U.ago = function (ts, now) {
    if (!ts) return '';
    var s = Math.max(0, Math.round(((now || Date.now()) - ts) / 1000));
    if (s < 90) return 'gerade eben';
    if (s < 3600) return 'vor ' + Math.round(s / 60) + NBSP + 'Min.';
    if (s < 86400) return 'vor ' + Math.round(s / 3600) + NBSP + 'Std.';
    if (s < 172800) return 'gestern';
    if (s < 7 * 86400) return 'vor ' + Math.round(s / 86400) + NBSP + 'Tagen';
    return U.dateShort(ts);
  };

  var DF = {};
  function df(key, opt) {
    if (!DF[key]) DF[key] = new Intl.DateTimeFormat('de-DE', opt);
    return DF[key];
  }
  U.clock = function (ts) { return df('clock', { hour: '2-digit', minute: '2-digit' }).format(new Date(ts)); };
  U.dateShort = function (ts) { return df('ds', { day: '2-digit', month: '2-digit' }).format(new Date(ts)); };
  U.dateLong = function (ts) { return df('dl', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(ts)); };
  U.weekdayClock = function (ts) {
    return df('wc', { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)).replace(',', '');
  };
  U.dateTime = function (ts) {
    return df('dt', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)).replace(',', '');
  };

  /* Dauer in Worten: 11520000 -> "3 h 12 min" */
  U.dur = function (ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    if (m < 60) return m + NBSP + 'min';
    var h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return h + NBSP + 'h' + (r ? ' ' + r + NBSP + 'min' : '');
    var d = Math.floor(h / 24), rh = h % 24;
    return d + NBSP + (d === 1 ? 'Tag' : 'Tage') + (rh ? ' ' + rh + NBSP + 'h' : '');
  };

  /* Lokales Datum als YYYY-MM-DD */
  U.ymd = function (d) {
    d = d instanceof Date ? d : new Date(d);
    return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate());
  };
  U.daysBetween = function (ymdA, ymdB) {
    var a = Date.UTC(+ymdA.slice(0, 4), +ymdA.slice(5, 7) - 1, +ymdA.slice(8, 10));
    var b = Date.UTC(+ymdB.slice(0, 4), +ymdB.slice(5, 7) - 1, +ymdB.slice(8, 10));
    return Math.round((b - a) / 86400000);
  };

  /* ---------- Ablaufsteuerung ---------- */
  U.debounce = function (fn, ms) {
    var t = null;
    return function () {
      var a = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, a); }, ms);
    };
  };
  U.sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  U.uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };

  /* Höchstens n Aufgaben gleichzeitig ausführen */
  U.pool = function (items, n, worker) {
    var i = 0, out = new Array(items.length);
    function next() {
      if (i >= items.length) return Promise.resolve();
      var idx = i++;
      return Promise.resolve().then(function () { return worker(items[idx], idx); })
        .then(function (r) { out[idx] = { ok: true, value: r }; }, function (e) { out[idx] = { ok: false, error: e }; })
        .then(next);
    }
    var runners = [];
    for (var k = 0; k < Math.min(n, items.length); k++) runners.push(next());
    return Promise.all(runners).then(function () { return out; });
  };

  /* ---------- Netz ---------- */
  function NetError(code, message, status) {
    var e = new Error(message || code);
    e.code = code; e.status = status || 0;
    return e;
  }
  U.NetError = NetError;

  U.fetchText = function (url, opt) {
    opt = opt || {};
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, opt.timeout || 9000);
    var init = { credentials: 'omit', referrerPolicy: 'no-referrer' };
    if (ctrl) init.signal = ctrl.signal;
    if (opt.headers) init.headers = opt.headers;
    if (opt.method) init.method = opt.method;
    if (opt.body != null) init.body = opt.body;
    return fetch(url, init).then(function (r) {
      return r.text().then(function (t) {
        clearTimeout(timer);
        return { ok: r.ok, status: r.status, text: t };
      });
    }, function (err) {
      clearTimeout(timer);
      throw NetError(err && err.name === 'AbortError' ? 'timeout' : 'net', 'Keine Verbindung');
    });
  };

  U.fetchJson = function (url, opt) {
    return U.fetchText(url, opt).then(function (r) {
      var data = null;
      try { data = JSON.parse(r.text); } catch (e) { data = null; }
      return { ok: r.ok, status: r.status, data: data, text: r.text };
    });
  };

  /* ---------- Speicher ---------- */
  U.lsGet = function (key, def) {
    try {
      var v = root.localStorage.getItem(key);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  };
  U.lsSet = function (key, val) {
    try { root.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  };
  U.lsDel = function (key) { try { root.localStorage.removeItem(key); } catch (e) { /* egal */ } };

  /* Zwischenspeicher mit Ablaufzeit (Speicher + optional localStorage) */
  var MEM = {};
  U.cacheGet = function (key, ttl, persist) {
    var e = MEM[key];
    if (!e && persist) { e = U.lsGet('bc.c.' + key, null); if (e) MEM[key] = e; }
    if (e && (Date.now() - e.t) < ttl) return e.d;
    return undefined;
  };
  U.cacheSet = function (key, data, persist) {
    var e = { t: Date.now(), d: data };
    MEM[key] = e;
    if (persist) U.lsSet('bc.c.' + key, e);
  };
  /* Ohne Angabe alles, sonst nur Einträge, deren Schlüssel mit prefix beginnt */
  U.cacheClear = function (prefix) {
    prefix = prefix || '';
    Object.keys(MEM).forEach(function (k) { if (k.indexOf(prefix) === 0) delete MEM[k]; });
    try {
      var del = [];
      for (var i = 0; i < root.localStorage.length; i++) {
        var k = root.localStorage.key(i);
        if (k && k.indexOf('bc.c.' + prefix) === 0) del.push(k);
      }
      del.forEach(function (k) { root.localStorage.removeItem(k); });
    } catch (e) { /* egal */ }
  };

  /* ---------- Ereignisse ---------- */
  var subs = {};
  BC.bus = {
    on: function (ev, fn) { (subs[ev] = subs[ev] || []).push(fn); return function () { BC.bus.off(ev, fn); }; },

  };

  U.copy = function (text) {
    if (root.navigator && root.navigator.clipboard && root.navigator.clipboard.writeText) {
      return root.navigator.clipboard.writeText(text).then(function () { return true; }, function () { return U.copyFallback(text); });
    }
    return Promise.resolve(U.copyFallback(text));
  };
  U.copyFallback = function (text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;font-size:16px';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

  /* Wie alt darf ein Aktienkurs sein, bevor er neu abgerufen wird? Läuft die Live-Verbindung für den Wert, hält sie den

  /* opt.maxAge: fester Abstand · opt.slow: Mindestabstand für Listen, die nicht im Sekundentakt stimmen müssen */

        UI.actRow({ href: '#zahlen', icon: 'bolt', t: 'Quartalszahlen live', d: 'Termine, Ist gegen Erwartung, Einschätzung' }) +
        UI.actRow({ href: '#mehr/rechner', icon: 'calc', t: 'Optionsschein-Rechner', d: 'Hebel, Break-even, Zeitwert und Szenarien' }) +
        UI.actRow({ href: '#mehr/termine', icon: 'calendar', t: 'Termine', d: 'Quartalszahlen deiner Werte, US-Feiertage' }) +
        UI.actRow({ href: '#makro', icon: 'globe', t: 'Makro und Kalender', d: 'Wirtschaftsdaten, Zinsen, Notenbanken' }) +
        '</nav>';
      draw(true);
      drawHist();
      drawBrief();
      drawDayline();
      offs.push(BC.bus.on('ticks', drawSoon));
      offs.push(BC.bus.on('quotes', drawSoon));
      offs.push(BC.bus.on('live', drawSoon));
      load();
      loadBrief();
      loadEarn();
      BC.app.every(30000, drawDayline);
      BC.app.every(2 * 60000, loadEarn);
      BC.app.every(A.hasFinnhub() ? 60000 : 15000, load);
      BC.app.every(3 * 60000, loadBrief);
    },
    leave: function () {
      offs.forEach(function (off) { off(); });
      offs = [];
      A.live.stop();
    },
    acts: {
      'setup-done': function (btn) {
        BC.state.hints[btn.getAttribute('data-v')] = true;
        BC.save();
        var card = btn.closest('.setup');
        if (card) card.outerHTML = setupCard();
      }
    }
  };

  /* ================= Positionen anlegen, ändern, ansehen (übergreifend) ================= */
  var KINDS = [{ v: 'stock', n: 'Aktie oder ETF' }, { v: 'crypto', n: 'Krypto' }, { v: 'warrant', n: 'Optionsschein' },
    { v: 'manual', n: 'Ohne Live-Kurs' }, { v: 'cash', n: 'Konto' }];
  var form = { kind: 'stock', id: '', type: 'call' };

  function fld(id, label, val, o) {
    o = o || {};

  }
  function numStr(v) { return v > 0 ? String(v).replace('.', ',') : ''; }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function readForm() {
    return { name: val('fName'), u: val('fU'), qty: val('fQty'), buy: val('fBuy'), strike: val('fStrike'), ratio: val('fRatio'),
      expiry: val('fExpiry'), price: val('fPrice'), pS: val('fPS'), amount: val('fAmount'), via: val('fVia') };
  }
  function formError(msg) {
    var el = document.getElementById('fErr');

  var BUTTONS = '<p class="form-err" id="fErr" role="alert" hidden></p><div class="btn-row is-end">' +
    '<button type="button" class="btn btn-quiet" data-act="sheet-close">Abbrechen</button><button type="submit" class="btn">Speichern</button></div>';

  function formHtml(v) {
    var k = form.kind, h = '';
    var qtyBuy = '<div class="field-pair">' + fld('fQty', k === 'crypto' ? 'Menge' : 'Stückzahl', v.qty, { mode: 'decimal' }) +
      fld('fBuy', k === 'warrant' ? 'Kaufkurs in €' : 'Kaufkurs je Stück in €', v.buy, { mode: 'decimal' }) + '</div>';
    if (!form.id) h += UI.chips(KINDS, k, 'pos-kind', 'Art der Position');
    if (k === 'cash') {
      h += fld('fName', 'Bezeichnung', v.name, { ph: 'z. B. Tagesgeld' }) + fld('fAmount', 'Betrag in €', v.amount, { mode: 'decimal' });
    } else if (k === 'warrant') {
      h += fld('fU', 'Basiswert (Ticker)', v.u, { ph: 'z. B. NVDA', caps: 'characters' }) +
        UI.chips([{ v: 'call', n: 'Call' }, { v: 'put', n: 'Put' }], form.type, 'pos-type', 'Art des Scheins') +
        '<div class="field-pair">' + fld('fStrike', 'Basispreis in $', v.strike, { mode: 'decimal' }) +
        fld('fRatio', 'Bezugsverhältnis', v.ratio, { mode: 'decimal', ph: 'z. B. 0,1' }) + '</div>' +
        fld('fExpiry', 'Letzter Bewertungstag', v.expiry, { type: 'date' }) + qtyBuy +
        fld('fPrice', 'Aktueller Kurs des Scheins in €', v.price, { mode: 'decimal', help: 'Geldkurs aus deinem Depot. Von dort aus schätzt die App den Kurs mit jeder Bewegung des Basiswerts weiter.' }) +
        fld('fPS', 'Kurs des Basiswerts in $', v.pS, { mode: 'decimal', help: 'Nur nötig, solange keine Live-Kurse eingerichtet sind.' }) +
        fld('fName', 'Name oder WKN', v.name, { ph: 'freiwillig' });
    } else if (k === 'manual') {
      h += fld('fName', 'Name', v.name, { ph: 'z. B. MSCI World ETF' }) + qtyBuy +
        fld('fPrice', 'Aktueller Kurs in €', v.price, { mode: 'decimal', help: 'Für Werte ohne kostenlosen Live-Kurs, zum Beispiel ETF und Aktien an deutschen Börsen.' }) +
        fld('fVia', 'Vergleichswert (US-Ticker)', v.via, { ph: 'freiwillig, z. B. URTH', caps: 'characters', help: 'Ein US-Wert, der gleich läuft, etwa URTH für einen MSCI-World-ETF. Dann schätzt die App den Kurs laufend weiter.' });
    } else {
      h += fld('fU', k === 'crypto' ? 'Kürzel' : 'Ticker', v.u, { ph: k === 'crypto' ? 'z. B. BTC' : 'z. B. NVDA', caps: 'characters' }) + qtyBuy +
