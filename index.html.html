  --text:#101828; --muted:#566178; --dim:#8791a4;
  --accent:#a25f00; --accent-soft:rgba(242,179,61,.24);
  --up:#0a8a5f; --up-soft:rgba(10,138,95,.12); --down:#cf2f3c; --down-soft:rgba(207,47,60,.10);
  --info:#1b68cc; --warn:#b9530b;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html:has(#sheet:not([hidden])),html:has(#full:not([hidden])){overflow:hidden}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--f-body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-wrap:break-word}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;z-index:99;background:var(--btn);color:var(--on-btn);padding:10px 14px;border-radius:0 0 10px 0}
.skip:focus{left:0}
.is-up{color:var(--up)} .is-down{color:var(--down)} .is-flat{color:var(--muted)}
.ic{display:block;flex:none}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:30;padding-top:var(--sat);background:var(--bg);border-bottom:1px solid var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .top{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
}
:root[data-theme="light"] .top::before{content:'';position:absolute;left:0;right:0;top:0;height:var(--sat);background:#0c111c}
.top-in{height:var(--top-h);display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;max-width:760px;margin:0 auto}
.top-lead{display:flex;margin-left:-10px}
.top-lead:empty{display:none}
.top-title{flex:1;min-width:0;font:700 26px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acts{display:flex;align-items:center;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 11.5px/1 var(--f-body);white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.is-open{color:var(--up)} .pill.is-open::before{background:var(--up)}
.pill.is-pre,.pill.is-post{color:var(--accent)} .pill.is-pre::before,.pill.is-post::before{background:var(--accent)}

/* ---------- Ansicht und Reiter ---------- */
.view{max-width:760px;margin:0 auto;padding:14px 16px calc(var(--tab-h) + var(--sab) + 28px);display:flex;flex-direction:column;gap:14px;outline:none}
.stack{display:flex;flex-direction:column;gap:14px}
.stack:empty{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:var(--sab);background:var(--surface);border-top:1px solid var(--line)}
.tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:760px;margin:0 auto}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);text-decoration:none;font:600 10.5px/1 var(--f-body)}
.tab .ic{width:24px;height:24px}
.tab.is-on{color:var(--accent)}
.tab{position:relative}
.tab-dot{position:absolute;top:9px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--down);box-shadow:0 0 0 2px var(--surface)}
.seg-nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg-link{height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none}
.seg-link.is-on{background:var(--surface-2);color:var(--text)}

/* ---------- Karten ---------- */
.panel,.dayline,.setup,.hero,.depot,.pos,.menu,.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel{overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 8px 16px;min-height:48px}
.panel-head h2,.group-title,.movers h2,.setup h2,.sub{font:700 16px/1.15 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel-controls{display:grid;gap:8px;padding:0 16px 12px}
.panel-body{padding:0 16px 16px}
.panel-body.is-flush{padding:0}
.panel-body.is-list{padding:0 16px}
.panel-src{padding:10px 16px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.4}
.panel-src a{color:var(--muted)}
.pad{padding:0 16px 12px;display:grid;gap:6px}
.group-title{margin:6px 2px -4px}
.lead{color:var(--muted);font-size:14px}
.about{color:var(--dim);font-size:12px;text-align:center;padding:6px 16px}

/* ---------- Knöpfe, Chips, Felder ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.55}
.btn-quiet{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--down);color:#fff}
.btn-quiet.is-danger{color:var(--down)}
.btn-small{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn-wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row.is-end{justify-content:flex-end}
.btn-row.is-center{justify-content:center}
.btn-col{display:grid;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:12px;background:none;color:var(--text)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn .ic{width:22px;height:22px}
.icon-btn.is-danger{color:var(--down)}
.icon-btn.is-on{color:var(--accent)} .icon-btn.is-on .ic{fill:var(--accent)}
.text-btn{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;padding:10px 8px}
.text-link{font-weight:600;font-size:14px;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px 16px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:600 13px/1 var(--f-body);text-decoration:none;white-space:nowrap}
.chip.is-on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.filters{display:grid;gap:10px}
.input{width:100%;min-height:46px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-size:16px;-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--dim)}
.input:focus{outline:none;border-color:var(--accent)}
.textarea{min-height:104px;padding:11px 13px;line-height:1.4;resize:vertical;display:block}
.textarea.is-tall{min-height:260px;font-size:13px}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field-label{font-size:13px;font-weight:600;color:var(--muted)}
.field-help{font-size:12px;color:var(--dim);line-height:1.4}
.field-help a{color:var(--muted)}
.field-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.form-err{color:var(--down);font-size:13.5px;font-weight:600}
.form-note{font-size:13.5px;color:var(--muted)}
.form-note.is-ok{color:var(--up)} .form-note.is-warn{color:var(--warn)}
.panel-body > .field-label{margin:12px 0 8px}
.panel-body > .field-label:first-child{margin-top:0}
.panel-body > .form{margin-top:14px}
.panel-body > .form:first-child{margin-top:0}
.panel-body > .btn-row{margin-top:12px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;min-height:50px}
.switch-text{display:grid;gap:1px;min-width:0}
.switch-t{font-weight:600}
.switch-d{font-size:12.5px;color:var(--muted)}
.switch{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:50px;height:30px;margin:0;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);cursor:pointer;transition:background .15s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.switch:checked{background:var(--up);border-color:transparent}
.switch:checked::after{transform:translateX(20px)}
.feed-row{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.feed-row:first-child{border-top:0}
.feed-row .switch-row{flex:1;min-width:0}

/* ---------- Hinweise, leer, lädt ---------- */
.notice{padding:11px 13px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13.5px}
.notice.is-warn{color:var(--warn)}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:8px;justify-items:center}
.empty-title{color:var(--text);font-weight:700;font-size:15.5px}
.loading{padding:22px 0;color:var(--dim);font-size:13.5px;text-align:center}
.list-status{color:var(--dim);font-size:12px;min-height:17px;padding:0 2px}
.list-status.is-warn{color:var(--warn)}
.list-status:empty{display:none}
.more-row{padding:12px 0 2px}
.fresh{position:sticky;top:calc(var(--sat) + var(--top-h) + 8px);z-index:20;align-self:center;border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:13.5px;padding:9px 16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* ---------- TradingView ---------- */
.tv-host{position:relative;width:100%;min-height:46px;background:var(--surface)}
.tv-host .tradingview-widget-container,.tv-host .tradingview-widget-container__widget{width:100%;height:100%}
.tv-host iframe{display:block;width:100%!important;border:0}
.tv-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;pointer-events:none}
.tv-fail{padding:18px 16px;display:grid;gap:10px;justify-items:start;color:var(--muted);font-size:13.5px}
.tv-info{min-height:150px;margin:0 -16px;width:auto}
.tape{margin:0 -16px;border-block:1px solid var(--line);background:var(--surface)}
.tv-tape{min-height:46px}

/* ---------- Handelstag ---------- */
.dayline{padding:14px 16px 12px}
.dayline-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.dayline-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dayline.is-open .dayline-dot{background:var(--up);box-shadow:0 0 0 4px var(--up-soft)}
.dayline.is-pre .dayline-dot,.dayline.is-post .dayline-dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.dayline-sub{margin-top:2px;color:var(--muted);font-size:13px}
.dayline-bar{position:relative;display:flex;height:8px;margin-top:16px;border-radius:4px;background:var(--surface-2)}
.seg{height:100%}
.seg-pre{background:var(--accent-soft);border-radius:4px 0 0 4px}
.seg-open{background:var(--up);opacity:.8}
.seg-post{background:var(--accent-soft);border-radius:0 4px 4px 0}
.dayline-now{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--surface)}
.dayline-scale{position:relative;height:16px;margin-top:7px;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.dayline-scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.dayline-scale span:first-child,.dayline-scale span.is-end{transform:none}
.dayline-note{margin-top:8px;color:var(--muted);font-size:12px}

/* ---------- Einrichtung ---------- */
.setup{padding:14px 16px;border-color:var(--accent-soft);display:grid;gap:12px}
.setup h2{color:var(--accent)}
.setup ol{display:grid;gap:14px;counter-reset:step}
.setup li{position:relative;padding-left:34px;display:grid;gap:4px;counter-increment:step}
.setup li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-body);text-align:center}
.setup-t{font-weight:700}
.setup-d{color:var(--muted);font-size:13.5px}
.setup .btn-row{margin-top:6px}

/* ---------- Verbinden ---------- */
.status{flex:none;display:inline-flex;align-items:center;gap:6px;margin-right:8px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 11.5px/1 var(--f-body);white-space:nowrap}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.status.is-ok{background:var(--up-soft);color:var(--up)}
.status.is-warn{color:var(--warn)}
.conn-text{color:var(--muted);font-size:14px}
.conn-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:13px}
.conn .form-note{margin-top:12px}
.steps{display:grid;gap:18px;margin-top:14px;counter-reset:step}
.steps li{position:relative;display:grid;gap:8px;padding-left:34px;counter-increment:step}
.steps li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-body);text-align:center}

/* ---------- Depot ---------- */
.depot{padding:16px;background:linear-gradient(165deg,var(--surface-2),var(--surface) 62%)}
.depot-label{display:flex;align-items:center;gap:10px;font:700 16px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--up);font:600 11.5px/1 var(--f-body);letter-spacing:0;text-transform:none}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 1.8s ease-in-out infinite}
.depot-total{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-variant-numeric:tabular-nums}
.depot-num{font:700 54px/.92 var(--f-display);letter-spacing:.01em}
.depot-cur{font:700 24px/1 var(--f-display);color:var(--muted)}
.depot-day{margin-top:8px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.depot-day-l{color:var(--muted);font-weight:400;font-size:13px}
.depot .stats{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.depot-lead{margin:10px 0 14px;color:var(--muted)}
.depot-note{margin-top:10px;color:var(--dim);font-size:12px}
.depot-note a{color:var(--muted)}

/* ---------- Listen: Watchlist und Depot ---------- */
.rows{overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;background:none;color:inherit;text-align:left;text-decoration:none}
.row-main:active{background:var(--surface-2)}
.row-lwrap{min-width:0;display:block}
.row-l{min-width:0;display:grid;gap:2px}
.row-t{font:700 22px/1.05 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-n{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{flex:none;display:grid;justify-items:end;gap:1px;padding:2px 5px;margin-right:-5px;border-radius:8px;text-align:right;font-variant-numeric:tabular-nums}
.row-tools{display:flex;align-items:center;padding-right:6px}
.row.is-edit .row-r{display:none}
.row-empty{padding:0 16px}
.q-price{font-weight:600;font-size:16px;line-height:1.25}
.q-price small{margin-left:3px;color:var(--muted);font-size:11px;font-weight:600}
.q-chg{font-weight:600;font-size:13px;line-height:1.3}
.q-vol{color:var(--muted);font-size:11.5px;line-height:1.3}
.q-vol.is-up{color:var(--up)} .q-vol.is-down{color:var(--down)}
.q-none{color:var(--dim)}
.flash-up{animation:flashUp .9s ease-out}
.flash-down{animation:flashDown .9s ease-out}
.add{display:flex;gap:8px}
.add .input{flex:1;min-width:0}
.suggest{margin-top:-6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.suggest-item{display:flex;align-items:baseline;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.suggest-item:first-child{border-top:0}
.suggest-t{flex:none;min-width:62px;font:700 18px/1 var(--f-display)}
.suggest-n{min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movers h2{margin:0 2px 8px}
.movers-row{display:flex;gap:8px;margin:0 -16px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.movers-row::-webkit-scrollbar{display:none}
.mover{flex:none;min-width:88px;display:grid;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;font-variant-numeric:tabular-nums}
.mover.is-up{background:var(--up-soft);border-color:transparent}
.mover.is-down{background:var(--down-soft);border-color:transparent}
.mover-t{font:700 19px/1 var(--f-display);color:var(--text)}
.mover-p{font-weight:600;font-size:13px}

/* ---------- Menüzeilen ---------- */
.menu{overflow:hidden}
.act-row{display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.act-row:first-child{border-top:0}
.act-row:active{background:var(--surface-2)}
.act-row.is-solo{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.act-text{flex:1;min-width:0;display:grid;gap:1px}
.act-t{font-weight:600}
.act-d{color:var(--muted);font-size:12.5px}
.act-row .ic{width:20px;height:20px;color:var(--dim)}
.act-row .act-ic{width:24px;height:24px;color:var(--accent)}
.panel-body.is-flush .act-row:first-child{border-top:1px solid var(--line)}

/* ---------- Einzelwert ---------- */
.hero{padding:16px;display:grid;gap:12px}
.hero-name{color:var(--muted);font-size:13.5px}
.hero-price{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.hero-num{font:700 56px/.92 var(--f-display);letter-spacing:.01em}
.hero-cur{font:700 24px/1 var(--f-display);color:var(--muted)}
.hero-chg{margin-top:8px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.hero-meta{margin-top:4px;color:var(--dim);font-size:12px}
.hero-wait{color:var(--dim);padding:18px 0}
.hero #sStats:empty{display:none}
.hero-pos{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-weight:600;font-size:13.5px;text-decoration:none}
.hero-pos .ic{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.stat{min-width:0}
.stat dt{color:var(--muted);font-size:12px}
.stat dd{margin-top:1px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.sub{margin:18px 0 4px}
.sub.is-first{margin-top:0}
.fact{display:grid;gap:2px}
.fact-k{color:var(--muted);font-size:12px}
.fact-v{font-weight:700;font-size:16px}
.fact-s{color:var(--muted);font-size:13px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:inherit;font-size:14px;text-decoration:none}
.sub + .line,.line:first-child{border-top:0}
.line-l{min-width:0;display:grid;gap:1px}
.line-s{color:var(--muted);font-size:12px}
.line-r{flex:none;text-align:right;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.line-r.is-soon{color:var(--accent)}
.line > .ic{width:18px;height:18px;color:var(--dim)}
.badge{display:inline-block;min-width:44px;margin-right:8px;padding:2px 6px;border-radius:6px;background:var(--surface-2);font-weight:700;font-size:12px;text-align:center}
.badge.is-key{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{padding:6px 8px;color:var(--muted);font-weight:600;font-size:12px;text-align:right;white-space:nowrap}
.tbl td{padding:8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:0;text-align:left}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl td small{display:block;font-size:11.5px;font-weight:600}
.reco{display:grid;gap:7px}
.reco-bar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.reco-buy{background:var(--up)} .reco-hold{background:var(--dim)} .reco-sell{background:var(--down)}
.reco-legend{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.mood{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mood-text{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.mood-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--down)}
.mood-bull{background:var(--up)}
.post{padding:12px 0;border-top:1px solid var(--line)}
.post:first-child,.mood + .post{border-top:0}
.post-head{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}
.post-head .tag{flex:none}
.post-user{min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-at{color:var(--muted);font-weight:600}
.post.is-fresh{animation:flashNew 2.6s ease-out}
.pad-list{padding:0 16px}
.pad-note{padding:12px 0}
.fold.is-rows{border-top:1px solid var(--line)}
.fold.is-rows summary{padding:14px 16px;color:var(--muted);font-size:14px}
.post-main{display:block;margin-top:5px;color:inherit;text-decoration:none}
.post-body{font-size:14.5px;overflow-wrap:anywhere}
.post-foot{margin-top:4px;color:var(--muted);font-size:12px}

/* ---------- Nachrichten ---------- */
.news{padding:13px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news-head{display:flex;align-items:center;gap:8px;font-size:12px}
.news-src{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier-p{color:var(--info)} .tier-a{color:var(--text)} .tier-b{color:var(--muted)} .tier-c{color:var(--dim)}
.news-prim{flex:none;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);font-weight:700;font-size:10.5px}
.news-time{flex:none;margin-left:auto;color:var(--dim)}
.news-time.is-fresh{color:var(--accent);font-weight:700}
.news-main{display:grid;gap:4px;margin-top:5px;color:inherit;text-decoration:none}
.news-title{font-weight:600;font-size:15.5px;line-height:1.35}
.news-sum{color:var(--muted);font-size:13px;line-height:1.4}
.news-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.news-more{color:var(--dim);font-size:11.5px}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border:0;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 11.5px/1 var(--f-body)}
.tag-sym{background:var(--accent-soft);color:var(--accent)}
.tag-bull{background:var(--up-soft);color:var(--up)}
.tag-bear{background:var(--down-soft);color:var(--down)}
.tag-new{background:var(--accent-soft);color:var(--accent)}

/* ---------- Rechner ---------- */
.pos{padding:16px;display:grid;gap:12px}
.pos-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pos-head h3{font:700 24px/1.05 var(--f-display);letter-spacing:.02em}
.pos-pl{font-weight:700;font-variant-numeric:tabular-nums}
.pos-sub{margin-top:-8px;color:var(--muted);font-size:13px}

/* ---------- Hilfe ---------- */
.fold{border-top:1px solid var(--line)}
.fold:first-child{border-top:0}
.fold summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;font-weight:700;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.fold[open] summary::after{transform:rotate(-135deg)}
.prose{display:grid;gap:10px;padding-bottom:16px;color:var(--muted);font-size:14.5px;max-width:65ch}
.prose strong{color:var(--text)}
.prose ol,.prose ul{display:grid;gap:6px;padding-left:20px}
.prose ol{list-style:decimal} .prose ul{list-style:disc}

/* ---------- Blatt, Vollbild, Hinweis ---------- */
#sheet{position:fixed;inset:0;z-index:60}
.sheet-back{position:absolute;inset:0;background:rgba(3,6,12,.62)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-width:760px;max-height:92%;margin:0 auto;display:flex;flex-direction:column;padding-bottom:var(--sab);border-radius:20px 20px 0 0;background:var(--surface);box-shadow:0 -12px 44px rgba(0,0,0,.4);animation:sheetUp .22s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 8px 18px}
.sheet-head h2{min-width:0;font:700 24px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.sheet-body{display:grid;gap:14px;padding:4px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-text{color:var(--muted);font-size:14px}
.full{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;padding:var(--sat) 0 var(--sab);background:var(--bg)}
.full-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px}
.full-head h2{font:700 24px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.full-body{position:relative;flex:1;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 14px);z-index:70;transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 17px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.35)}

#toast.is-link{left:16px;right:16px;transform:none;max-width:520px;margin:0 auto;padding:0;border-radius:16px;text-align:left}
#toast.is-link a{display:grid;gap:2px;padding:12px 16px;color:inherit;text-decoration:none}
#toast.is-link strong{font-size:12px;opacity:.72}
#toast.is-link span{font-size:14px;line-height:1.35}
@keyframes flashNew{from{background:var(--accent-soft)}to{background:transparent}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes flashUp{from{background:var(--up-soft)}to{background:transparent}}
@keyframes flashDown{from{background:var(--down-soft)}to{background:transparent}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .view{padding-top:20px}
}

</style>
</head>

    h += '<p class="depot-total"><span class="depot-num">' + U.num(t.n ? t.value : t.cash, 2) + '</span><span class="depot-cur">€</span></p>';
    if (t.dayBase > 0) {
      h += '<p class="depot-day is-' + U.dir(t.day) + '">' + UI.eurSigned(t.day) + ' · ' + U.pct(t.dayPct * 100) + ' <span class="depot-day-l">heute</span></p>';
    }
    var rows = [];
    if (t.n) {
      rows.push(['Gewinn gesamt', UI.eurSigned(t.pl) + (t.plPct != null ? ' · ' + U.pct(t.plPct * 100, 1) : ''), 'is-' + U.dir(t.pl)]);
      rows.push(['Einstand', UI.eur(t.cost)]);
      if (t.cash > 0) { rows.push(['Konten', UI.eur(t.cash)]); rows.push(['Alles zusammen', UI.eur(t.total)]); }
    }
    if (rows.length) h += UI.stats(rows);
    var notes = [], ctx = D.ctx();
    if (t.est) notes.push(plural(t.est, 'Ein Optionsschein ist', 'Optionsscheine sind') + ' aus dem Kurs des Basiswerts geschätzt.');
    if (t.missing) notes.push(plural(t.missing, 'Eine Position zählt', 'Positionen zählen') + ' ohne Kurs mit dem Einstand.');
    if (t.n && !ctx.fx) notes.push('Der Wechselkurs EUR/USD ist gerade nicht erreichbar.');
    var old = 0;
    D.symbols().forEach(function (s) { var q = A.q[s.id]; if (q && q.old && (!old || q.old < old)) old = q.old; });
    if (old) notes.push('Letzter Stand vom ' + U.dateTime(old) + ' Uhr' + (loading ? ', wird gerade aktualisiert.' : (root.navigator && root.navigator.onLine === false ? '. Gerade besteht keine Verbindung.' : '.')));
    if (notes.length) h += '<p class="depot-note">' + e(notes.join(' ')) + '</p>';
    var needKey = D.list().some(function (p) { return p.kind === 'stock' || p.kind === 'warrant'; });
    if (needKey && !A.hasFinnhub()) {
      h += '<p class="depot-note">Für Live-Kurse von Aktien fehlt der kostenlose Finnhub-Schlüssel. <a href="#mehr/verbinden">Schlüssel eintragen</a></p>';
    }
    return h;
  }

  function leftHtml(p, v) {
    var t = D.label(p), n;
    if (p.kind === 'cash') n = 'Konto';
    else if (p.kind === 'warrant') {
      n = (p.qty ? UI.qty(p.qty) + ' Stück · ' : '') + (v.price ? eurP(v.price) + (v.est ? ' geschätzt' : ' eingetragen') : 'Kurs fehlt');
    } else {
      n = UI.qty(p.qty) + (p.kind === 'crypto' ? '' : ' Stück') + (v.price ? ' · ' + eurP(v.price) : '');
    }
    return '<span class="row-l"><span class="row-t">' + e(t) + '</span><span class="row-n">' + e(n) + '</span></span>';
  }
  function rightHtml(p, v) {
    if (v.cash) return '<span class="q-price">' + U.num(v.value, 2) + '<small>€</small></span>';
    if (!v.ok) return '<span class="q-none">kein Kurs</span>' + (v.cost ? '<span class="q-vol">Einstand ' + UI.eur(v.cost) + '</span>' : '');
    var h = '<span class="q-price">' + U.num(v.value, 2) + '<small>€</small></span>';
    if (v.day != null) h += '<span class="q-chg is-' + U.dir(v.day) + '">' + UI.eurSigned(v.day) + (p.kind === 'crypto' ? ' in 24 Std.' : ' heute') + '</span>';
    if (v.pl != null) h += '<span class="q-vol is-' + U.dir(v.pl) + '">' + UI.eurSigned(v.pl) + ' · ' + U.pct(v.plPct * 100, 1) + '</span>';
    return h;
  }
  function rowHtml(r) {
    return '<li class="row"><button type="button" class="row-main" data-act="pos-open" data-id="' + e(r.p.id) + '">' +
      '<span data-posl="' + e(r.p.id) + '" class="row-lwrap">' + leftHtml(r.p, r.v) + '</span>' +
      '<span class="row-r" data-pos="' + e(r.p.id) + '">' + rightHtml(r.p, r.v) + '</span></button></li>';
  }
  function listHtml(t) {
    var pos = t.rows.filter(function (r) { return !r.v.cash; }), cash = t.rows.filter(function (r) { return r.v.cash; }), h = '';
    if (pos.length) h += UI.group('Positionen') + '<ul class="rows">' + pos.map(rowHtml).join('') + '</ul>';
    if (cash.length) h += UI.group('Konten') + '<ul class="rows">' + cash.map(rowHtml).join('') + '</ul>';
    if (t.rows.length) h += '<button type="button" class="btn btn-quiet btn-wide" data-act="pos-add">Position oder Konto hinzufügen</button>';
    return h;
  }

  /* full: Liste neu aufbauen; sonst nur die Zahlen austauschen (Tippen und Scrollen bleiben ungestört) */
  function draw(full) {
    var head = document.getElementById('depotHead'), body = document.getElementById('depotBody');
    if (!head || !body) return;
    var t = D.totals(D.list(), D.ctx());
    head.innerHTML = headHtml(t);
    if (full) { body.innerHTML = listHtml(t); return; }
    t.rows.forEach(function (r) {
      var cell = body.querySelector('[data-pos="' + r.p.id + '"]'), left = body.querySelector('[data-posl="' + r.p.id + '"]');
      if (cell) cell.innerHTML = rightHtml(r.p, r.v);
      if (left) left.innerHTML = leftHtml(r.p, r.v);
    });
  }
  function drawSoon() {
    if (pending) return;
    pending = true;
    setTimeout(function () { pending = false; draw(false); }, 500);
  }

  function load() {
    var after = function () { loading = false; draw(false); };
    loading = true;
    D.refresh().then(after, after);
    if (A.hasFinnhub()) A.live.set(D.symbols());
  }

  V.money = {
    tab: 'money',
    title: function () { return 'Money'; },
    actions: function () {
      return '<button type="button" class="icon-btn" data-act="pos-add" aria-label="Position hinzufügen">' + UI.icon('plus') + '</button>';
    },
    render: function (el) {
      el.innerHTML = setupCard() +
        '<section class="depot" id="depotHead" aria-label="Depot" aria-live="off"></section>' +
        '<div class="stack" id="depotBody"></div>' +
        '<div id="dayline"></div>' +
        '<nav class="menu" aria-label="Werkzeuge">' +
        UI.actRow({ href: '#mehr/rechner', icon: 'calc', t: 'Optionsschein-Rechner', d: 'Hebel, Break-even, Zeitwert und Szenarien' }) +
        UI.actRow({ href: '#mehr/termine', icon: 'calendar', t: 'Termine', d: 'Quartalszahlen deiner Werte, US-Feiertage' }) +
        UI.actRow({ href: '#makro', icon: 'globe', t: 'Makro und Kalender', d: 'Wirtschaftsdaten, Zinsen, Notenbanken' }) +
        '</nav>';
      draw(true);
      drawDayline();
      offs.push(BC.bus.on('ticks', drawSoon));
      offs.push(BC.bus.on('quotes', drawSoon));
      offs.push(BC.bus.on('live', drawSoon));
      load();
      BC.app.every(30000, drawDayline);
      BC.app.every(A.hasFinnhub() ? 60000 : 15000, load);
    },
    leave: function () {
      offs.forEach(function (off) { off(); });
      offs = [];
      A.live.stop();
    },
    acts: {
      'setup-done': function (btn) {
        BC.state.hints[btn.getAttribute('data-v')] = true;
        BC.save();
        var card = btn.closest('.setup');
        if (card) card.outerHTML = setupCard();
      }
    }
  };

  /* ================= Positionen anlegen, ändern, ansehen (übergreifend) ================= */
  var KINDS = [{ v: 'stock', n: 'Aktie oder ETF' }, { v: 'crypto', n: 'Krypto' }, { v: 'warrant', n: 'Optionsschein' }, { v: 'cash', n: 'Konto' }];
  var form = { kind: 'stock', id: '', type: 'call' };

  function fld(id, label, val, o) {
    o = o || {};
    return UI.field({ id: id, label: label, value: val == null ? '' : val, mode: o.mode, placeholder: o.ph, help: o.help, caps: o.caps, type: o.type });
  }
  function numStr(v) { return v > 0 ? String(v).replace('.', ',') : ''; }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function readForm() {
    return { name: val('fName'), u: val('fU'), qty: val('fQty'), buy: val('fBuy'), strike: val('fStrike'), ratio: val('fRatio'),
      expiry: val('fExpiry'), price: val('fPrice'), pS: val('fPS'), amount: val('fAmount') };
  }
  function formError(msg) {
    var el = document.getElementById('fErr');
    if (el) { el.textContent = msg || ''; el.hidden = !msg; }
    return false;
  }
  var BUTTONS = '<p class="form-err" id="fErr" role="alert" hidden></p><div class="btn-row is-end">' +
    '<button type="button" class="btn btn-quiet" data-act="sheet-close">Abbrechen</button><button type="submit" class="btn">Speichern</button></div>';

  function formHtml(v) {
    var k = form.kind, h = '';
    if (!form.id) h += UI.chips(KINDS, k, 'pos-kind', 'Art der Position');
    if (k === 'cash') {
      h += fld('fName', 'Bezeichnung', v.name, { ph: 'z. B. Tagesgeld' }) + fld('fAmount', 'Betrag in €', v.amount, { mode: 'decimal' });
    } else if (k === 'warrant') {
      h += fld('fU', 'Basiswert (Ticker)', v.u, { ph: 'z. B. NVDA', caps: 'characters' }) +
        UI.chips([{ v: 'call', n: 'Call' }, { v: 'put', n: 'Put' }], form.type, 'pos-type', 'Art des Scheins') +
        '<div class="field-pair">' + fld('fStrike', 'Basispreis in $', v.strike, { mode: 'decimal' }) +
        fld('fRatio', 'Bezugsverhältnis', v.ratio, { mode: 'decimal', ph: 'z. B. 0,1' }) + '</div>' +
        fld('fExpiry', 'Letzter Bewertungstag', v.expiry, { type: 'date' }) +
        '<div class="field-pair">' + fld('fQty', 'Stückzahl', v.qty, { mode: 'decimal' }) + fld('fBuy', 'Kaufkurs in €', v.buy, { mode: 'decimal' }) + '</div>' +
        fld('fPrice', 'Aktueller Kurs des Scheins in €', v.price, { mode: 'decimal', help: 'Geldkurs aus deinem Depot. Von dort aus schätzt die App den Kurs mit jeder Bewegung des Basiswerts weiter.' }) +
        fld('fPS', 'Kurs des Basiswerts in $', v.pS, { mode: 'decimal', help: 'Nur nötig, solange keine Live-Kurse eingerichtet sind.' }) +
        fld('fName', 'Name oder WKN', v.name, { ph: 'freiwillig' });
    } else {
      h += fld('fU', k === 'crypto' ? 'Kürzel' : 'Ticker', v.u, { ph: k === 'crypto' ? 'z. B. BTC' : 'z. B. NVDA', caps: 'characters' }) +
        '<div class="field-pair">' + fld('fQty', k === 'crypto' ? 'Menge' : 'Stückzahl', v.qty, { mode: 'decimal' }) +
        fld('fBuy', 'Kaufkurs je Stück in €', v.buy, { mode: 'decimal' }) + '</div>';
    }
    return '<form class="form" data-submit="pos-save" novalidate>' + h + BUTTONS + '</form>';
  }

  function openForm(p, kind) {
    form = { kind: p ? p.kind : (kind || 'stock'), id: p ? p.id : '', type: p && p.type === 'put' ? 'put' : 'call' };
    var s = p ? D.symOf(p) : null;
    var v = p ? {
      name: p.name, u: p.kind === 'crypto' && s ? s.t : (p.u || ''), qty: numStr(p.qty), buy: numStr(p.buy), strike: numStr(p.strike),
      ratio: numStr(p.ratio), expiry: p.expiry || '', price: numStr(p.price), pS: '', amount: numStr(p.amount)
    } : {};
    UI.sheet({ title: p ? D.label(p) + ' bearbeiten' : 'Neue Position', body: formHtml(v), focus: false });
  }

  /* Symbol aus dem Formular; bei Krypto wird ein unbekanntes Kürzel als Binance-Paar gelesen */
  function symFromInput(text, kind) {
    var s = BC.sym.parse(text);
    if (!s) return null;
    if (kind === 'crypto') return BC.sym.isCrypto(s) ? s : BC.sym.parse('BINANCE:' + s.t + 'USDT');
    if (kind === 'warrant' && BC.sym.isCrypto(s)) return text.indexOf(':') >= 0 ? null : { id: s.t, t: s.t, n: '', k: 'stock' };
    return s;
  }

  /* Kurs des Basiswerts, Wechselkurs und Zeitpunkt zu einem eingetragenen Schein-Kurs festhalten */
  function snapshot(raw, sIn, sym) {
    function done(S) {
      raw.pS = S > 0 ? S : 0;
      raw.pFx = D.ctx().fx || 0;
      raw.pT = Date.now();
      return raw;
    }
    if (sIn > 0) return D.refresh().then(function () { return done(sIn); }, function () { return done(sIn); });
    var grab = function () { var q = A.q[sym.id]; return q && q.p > 0 ? q.p : 0; };
    var quiet = function () { /* still */ };
    return D.refresh().then(quiet, quiet)
      .then(function () { return grab() ? null : A.refreshQuotes([sym]).then(quiet, quiet); })
      .then(function () { return done(grab()); });
  }

  function finish(raw, msg) {
    var p = D.upsert(raw);
    if (!p) return formError('Die Angaben reichen noch nicht aus.');
    UI.closeSheet();
    UI.toast(msg || 'Gespeichert');
    BC.app.rerender();
    return true;
  }

  function savePos() {
    var v = readForm(), kind = form.kind, old = form.id ? D.get(form.id) : null;
    var raw = { id: form.id || U.uid(), kind: kind, name: v.name };
    if (kind === 'cash') {
      var amt = U.parseNum(v.amount);
      if (!v.name) return formError('Bitte eine Bezeichnung eintragen.');
      if (!(amt >= 0)) return formError('Bitte den Betrag in Euro eintragen.');
      raw.amount = amt;
      return finish(raw);
    }
    var sym = symFromInput(v.u, kind);
    if (!sym) return formError(kind === 'crypto' ? 'Bitte ein gültiges Kürzel eintragen, zum Beispiel BTC.' : 'Bitte einen gültigen Ticker eintragen, zum Beispiel NVDA.');
    if (kind === 'stock' && BC.sym.isCrypto(sym)) { kind = 'crypto'; raw.kind = 'crypto'; }   /* „BTC“ als Aktie eingetragen: als Krypto führen */
    raw.u = sym.id;
    var qty = U.parseNum(v.qty), buy = U.parseNum(v.buy);
    raw.qty = qty > 0 ? qty : 0;
    raw.buy = buy > 0 ? buy : 0;
    if (kind !== 'warrant') {
      if (!raw.qty) return formError(kind === 'crypto' ? 'Bitte die Menge eintragen.' : 'Bitte die Stückzahl eintragen.');
      return finish(raw);
    }
    raw.type = form.type;
    raw.strike = U.parseNum(v.strike);
    raw.ratio = U.parseNum(v.ratio);
    raw.expiry = v.expiry;
    if (!(raw.strike > 0)) return formError('Bitte den Basispreis eintragen.');
    if (!(raw.ratio > 0)) return formError('Bitte das Bezugsverhältnis eintragen, zum Beispiel 0,1.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(raw.expiry)) return formError('Bitte den letzten Bewertungstag wählen.');
    var price = U.parseNum(v.price), sIn = U.parseNum(v.pS);
    raw.price = price > 0 ? price : 0;
    var same = old && old.kind === 'warrant' && old.price === raw.price && old.u === raw.u && !(sIn > 0);
    if (same) { raw.pS = old.pS; raw.pFx = old.pFx; raw.pT = old.pT; return finish(raw); }
    if (!raw.price) return finish(raw, 'Gespeichert. Ohne Kurs des Scheins fehlt noch der Wert.');
    formError('');
    var btn = document.querySelector('#sheet button[type="submit"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Speichert …'; }
    snapshot(raw, sIn, sym).then(function (r) {
      finish(r, r.pS ? 'Gespeichert' : 'Gespeichert. Ohne Kurs des Basiswerts bleibt der Schein beim eingetragenen Kurs stehen.');
    });
    return true;
  }

  /* ---------- Einzelansicht einer Position ---------- */
  function openPos(id) {
    var p = D.get(id);
    if (!p) return;
    var v = D.value(p, D.ctx()), sym = D.symOf(p), rows = [], note = '', b = '', pid = e(p.id);
    if (p.kind === 'cash') rows.push(['Betrag', UI.eur(v.value)]);
    else {
      rows.push(['Wert', v.ok ? UI.eur(v.value) : '–']);
      if (v.day != null) rows.push([p.kind === 'crypto' ? 'Veränderung 24 Std.' : 'Veränderung heute', UI.eurSigned(v.day) + (v.dayPct != null ? ' · ' + U.pct(v.dayPct * 100) : ''), 'is-' + U.dir(v.day)]);
      if (v.pl != null) rows.push(['Gewinn gesamt', UI.eurSigned(v.pl) + ' · ' + U.pct(v.plPct * 100, 1), 'is-' + U.dir(v.pl)]);
      if (p.qty) rows.push([p.kind === 'crypto' ? 'Menge' : 'Stückzahl', UI.qty(p.qty)]);
      if (p.buy) rows.push(['Kaufkurs', eurP(p.buy)]);
      if (v.price) rows.push([v.est ? 'Kurs, geschätzt' : 'Kurs', eurP(v.price)]);
      if (v.S) rows.push([p.kind === 'warrant' ? 'Basiswert' : 'Kurs in Dollar', U.price(v.S) + ' $']);
      if (p.kind === 'warrant') {
        rows.push(['Basispreis', U.num(p.strike, 2) + ' $']);
        rows.push(['Bezugsverhältnis', UI.qty(p.ratio)]);
        rows.push(['Laufzeit bis', U.dateLong(Date.parse(p.expiry + 'T12:00:00Z'))]);
        if (p.price && p.pT) note = 'Kurs des Scheins zuletzt eingetragen am ' + U.dateTime(p.pT) + ' Uhr: ' + eurP(p.price) + '.';
        else if (!p.price) note = 'Trag den aktuellen Kurs des Scheins ein, damit das Depot ihn bewerten kann.';
        b += '<button type="button" class="btn" data-act="pos-price" data-id="' + pid + '">Kurs des Scheins eintragen</button>' +
          '<button type="button" class="btn btn-quiet" data-act="pos-scn" data-id="' + pid + '">Szenarien ansehen</button>';
      }
    }
    if (sym) b += '<a class="btn btn-quiet" href="#aktie/' + encodeURIComponent(sym.id) + '">' + e(sym.t) + ': Chart, News, Beiträge</a>';
    b += '<button type="button" class="btn btn-quiet" data-act="pos-edit" data-id="' + pid + '">Bearbeiten</button>' +
      '<button type="button" class="btn btn-quiet is-danger" data-act="pos-del" data-id="' + pid + '">Löschen</button>';
    UI.sheet({
      title: (p.kind === 'cash' ? '' : D.KIND_LABEL[p.kind] + ' ') + D.label(p), focus: false,
      body: (p.name && p.kind !== 'cash' ? '<p class="sheet-text">' + e(p.name) + '</p>' : '') + UI.stats(rows) +
        (note ? '<p class="notice">' + e(note) + '</p>' : '') + '<div class="btn-col">' + b + '</div>'
    });
  }

  /* ---------- Kurs eines Scheins schnell nachtragen ---------- */
  function openPrice(id) {
    var p = D.get(id);
    if (!p || p.kind !== 'warrant') return;
    var sym = D.symOf(p), q = sym && A.q[sym.id], liveS = q && q.p > 0 ? q.p : 0;
    form = { kind: 'warrant', id: id, type: p.type };
    UI.sheet({
      title: D.label(p),
      body: '<form class="form" data-submit="pos-price-save" novalidate>' +
        fld('fPrice', 'Aktueller Kurs des Scheins in €', '', { mode: 'decimal', help: p.price ? 'Zuletzt eingetragen: ' + eurP(p.price) : 'Geldkurs aus deinem Depot.' }) +
        (liveS ? '<p class="notice">Der Kurs des Basiswerts (' + U.price(liveS) + ' $) wird mitgespeichert.</p>'
          : fld('fPS', 'Kurs des Basiswerts in $', '', { mode: 'decimal', help: 'Nötig, weil gerade kein Live-Kurs vorliegt.' })) +
        BUTTONS + '</form>'
    });
  }
  function savePrice() {
    var p = D.get(form.id);
    if (!p) return;
    var price = U.parseNum(val('fPrice')), sIn = U.parseNum(val('fPS'));
    if (!(price > 0)) return formError('Bitte den Kurs des Scheins in Euro eintragen.');
    var sym = D.symOf(p), q = sym && A.q[sym.id], S = sIn > 0 ? sIn : (q && q.p > 0 ? q.p : 0);
    if (!S) return formError('Bitte auch den Kurs des Basiswerts eintragen.');
    var raw = JSON.parse(JSON.stringify(p));
    raw.price = price; raw.pS = S; raw.pFx = D.ctx().fx || 0; raw.pT = Date.now();
    finish(raw, 'Kurs gespeichert');
  }

  /* ---------- Szenarien eines Scheins ---------- */
  function openScn(id) {
    var p = D.get(id), inp = p ? D.warrantInput(p, D.ctx()) : null;
    var base = inp ? F.warrant(inp.w, inp.m) : null;
    if (!base) { UI.toast('Dafür fehlen der Kurs des Scheins und der des Basiswerts'); return; }
    var days = Math.max(0, Math.floor(base.days));
    var mid = Math.max(1, Math.min(30, Math.floor(days / 2)));
    var sc = F.scenarios(inp.w, inp.m, [50, 30, 20, 10, 5, 0, -5, -10, -20, -30], [0, mid, 'end']);
    function cell(c) {
      if (!c || c.value == null) return '<td>–</td>';
      return '<td class="is-' + U.dir(c.pl) + '">' + eurP(c.value) + (c.pl != null ? '<small>' + U.pct(c.pl * 100, 0) + '</small>' : '') + '</td>';
    }
    var rows = sc.map(function (r) {
      return '<tr><td>' + U.pct(r.move, 0) + '<small class="is-flat">' + U.price(r.S) + ' $</small></td>' + r.cells.map(cell).join('') + '</tr>';
    }).join('');
    UI.sheet({
      title: 'Szenarien ' + D.label(p), focus: false,
      body: '<p class="sheet-text">Kurs des Scheins je nach Kurs des Basiswerts. Ausgangspunkt: ' + eurP(inp.w.price) + ' bei ' + U.price(inp.m.S) + ' $' +
        (inp.live ? '' : ' (Stand der letzten Eingabe)') + '.</p>' +
        '<div class="table-wrap"><table class="tbl"><thead><tr><th>Basiswert</th><th>heute</th><th>in ' + mid + ' Tagen</th><th>am Ende</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="field-help">Näherung nach Black-Scholes mit gleichbleibender Schwankungserwartung' + (base.iv ? ' (' + U.num(base.iv * 100, 0) + ' %)' : '') +
        ' und gleichem Wechselkurs. Emittenten stellen eigene Kurse; Abweichungen sind normal.</p>'
    });
  }

  BC.app.registerActs({
    'pos-add': function (btn) { openForm(null, btn.getAttribute('data-v')); },
    'pos-edit': function (btn) { openForm(D.get(btn.getAttribute('data-id'))); },
    'pos-open': function (btn) { openPos(btn.getAttribute('data-id')); },
    'pos-kind': function (btn) {
      var v = readForm();

BC.WORKER_SRC = "// Börsen-Cockpit – eigener Feed-Proxy für Cloudflare Workers (der kostenlose Tarif genügt).\n// Aufruf durch die App: https://\u003cname>.workers.dev/?url=\u003cAdresse des Feeds>&k=\u003cKennwort>\n//                   oder: https://\u003cname>.workers.dev/?x=search&q=\u003cSuchtext>&k=\u003cKennwort>   (Beiträge von X, nur mit X_BEARER)\n// Einrichten: Skript im Worker einfügen, KEY ändern, veröffentlichen. Adresse und Kennwort in der App\n// unter Mehr → Einstellungen → „Eigener Proxy für Nachrichten“ eintragen.\n\nconst KEY = 'BITTE-AENDERN';   // eigenes Kennwort, mindestens 12 Zeichen\nconst X_BEARER = '';           // freiwillig: Bearer Token deiner App bei X (developer.x.com) für Beiträge direkt im Cockpit\nconst OPEN = false;            // true: auch Adressen außerhalb der Liste zulassen (für eigene Feeds)\nconst ALLOW = /(^|\\.)(bloomberg\\.com|google\\.com|cnbc\\.com|dowjones\\.io|yahoo\\.com|seekingalpha\\.com|federalreserve\\.gov|europa\\.eu|bls\\.gov|sec\\.gov|tagesschau\\.de|handelsblatt\\.com|faz\\.net|finanzen\\.net|coindesk\\.com|cointelegraph\\.com|stocktwits\\.com|businesswire\\.com|prnewswire\\.com|globenewswire\\.com)$/i;\n\nconst CORS = { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'GET, OPTIONS' };\nconst text = (body, status) => new Response(body, { status, headers: { ...CORS, 'Content-Type': 'text/plain; charset=utf-8' } });\n\nexport default {\n  async fetch(request) {\n    if (request.method === 'OPTIONS') return new Response(null, { headers: CORS });\n    if (request.method !== 'GET') return text('Nur GET', 405);\n    const here = new URL(request.url);\n    if (KEY === 'BITTE-AENDERN' || here.searchParams.get('k') !== KEY) return text('Kennwort fehlt oder ist falsch', 403);\n    if (here.searchParams.get('x') === 'search') return xSearch(here.searchParams);\n    let target;\n    try { target = new URL(here.searchParams.get('url') || ''); } catch (e) { return text('Adresse fehlt', 400); }\n    if (target.protocol !== 'https:' || (!OPEN && !ALLOW.test(target.hostname))) return text('Adresse nicht erlaubt', 400);\n    let res;\n    try {\n      res = await fetch(target.href, {\n        headers: {\n          'User-Agent': 'Mozilla/5.0 (compatible; BoersenCockpit/1.0; privater Feed-Leser)',\n          'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml, application/json;q=0.9, */*;q=0.5'\n        },\n        cf: { cacheTtl: 120, cacheEverything: true }\n      });\n    } catch (e) { return text('Quelle nicht erreichbar', 502); }\n    return new Response(await res.text(), {\n      status: res.status,\n      headers: { ...CORS, 'Content-Type': res.headers.get('Content-Type') || 'text/plain; charset=utf-8', 'Cache-Control': 'public, max-age=120' }\n    });\n  }\n};\n\n// Suche der offiziellen X-Schnittstelle (API v2, Beiträge der letzten sieben Tage). X rechnet je geliefertem Beitrag ab.\nasync function xSearch(p) {\n  if (!X_BEARER) return text('Kein X-Zugang hinterlegt', 501);\n  const q = (p.get('q') || '').trim();\n  if (!q || q.length > 512) return text('Suchtext fehlt oder ist zu lang', 400);\n  const api = new URLSearchParams({\n    query: q,\n    max_results: String(Math.min(100, Math.max(10, parseInt(p.get('max'), 10) || 10))),\n    sort_order: p.get('sort') === 'relevancy' ? 'relevancy' : 'recency',\n    'tweet.fields': 'created_at,public_metrics,lang,author_id'\n  });\n  const since = (p.get('since') || '').replace(/\\D/g, '');\n  if (since) api.set('since_id', since);\n  if (p.get('authors') === '1') {\n    api.set('expansions', 'author_id');\n    api.set('user.fields', 'username,name,verified,public_metrics');\n  }\n  let res;\n  try { res = await fetch('https://api.x.com/2/tweets/search/recent?' + api, { headers: { Authorization: 'Bearer ' + X_BEARER } }); }\n  catch (e) { return text('X nicht erreichbar', 502); }\n  return new Response(await res.text(), { status: res.status, headers: { ...CORS, 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store' } });\n}\n";
